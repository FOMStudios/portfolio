<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Your shoot brief</title>
<meta name="theme-color" content="#f1f0ec">
<link rel="icon" href="assets/logo-dark.png">
<style>
/* Client brief link (Nov 2026). Opened from a WhatsApp link the dashboard makes: brief.html?b=<id>
   FOM Studios look by default; Shot by A look when the brief belongs to her (body.sba). */
:root{--bg:#f1f0ec;--card:#fafaf9;--ink:#2a2b2c;--soft:#5c5b58;--line:#dcdad3;--accent:#02367B;--accent2:#022a5f;--on:#fff;--r:18px;--font:-apple-system,"Helvetica Neue",Arial,sans-serif;}
body.sba{--bg:#F3F2EC;--card:#fbfaf6;--ink:#0A100D;--soft:#4b4f4a;--line:rgba(10,16,13,.14);--accent:#780000;--accent2:#630606;--font:'Jost',-apple-system,"Helvetica Neue",Arial,sans-serif;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.top img{height:42px;width:auto;display:block}
body.sba .top img{height:42px}
.top span{font-size:12.5px;color:var(--soft);font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:22px;line-height:1.25;margin:0 0 6px;letter-spacing:-.01em}
body.sba h1{font-weight:500}
p.sub{margin:0 0 16px;color:var(--soft);font-size:14.5px;line-height:1.5}
h2{font-size:14px;margin:18px 0 8px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:64px;transition:border-color .15s,background .15s}
.opt .ic{font-size:22px}
.opt b{font-size:14.5px}
.opt small{color:var(--soft);font-size:12.5px;line-height:1.35}
.opt .pr{font-weight:800;font-size:13px;color:var(--accent)}
.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{border-color:var(--accent);background:var(--accent);color:var(--on)}
.field{margin-top:4px}
.field input,.field textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:0;padding:0;cursor:pointer;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.ph.on{outline:3px solid var(--accent);outline-offset:-3px}
.ph.on img{transform:scale(.94)}
.ph .tick{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:14px;font-weight:800;display:none;align-items:center;justify-content:center}
.ph.on .tick{display:flex}
.nav{display:flex;gap:10px;margin-top:20px;align-items:center}
.btn{border:0;border-radius:99px;padding:14px 20px;font-size:15.5px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--on);flex:1}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);flex:0 0 auto}
.skip{background:none;border:0;color:var(--soft);font-size:13.5px;font-weight:600;text-decoration:underline;cursor:pointer;padding:8px 4px}
.done{text-align:center;padding:30px 20px}
.done .ic{font-size:44px;margin-bottom:6px}
.done a.btn{display:inline-block;text-decoration:none;margin-top:14px;flex:none;padding:14px 26px}
.err{color:#b3261e;font-size:13.5px;margin-top:10px;min-height:1em}
.load{text-align:center;color:var(--soft);padding:60px 0}
.foot{text-align:center;color:var(--soft);font-size:12px;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img id="logo" src="assets/logo-dark.png" alt="FOM Studios"><span id="time">About 1 minute</span></div>
  <div class="bar"><i id="bar" style="width:0"></i></div>
  <div id="app"><div class="load">Loading your brief...</div></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  var WORKER = 'https://fom-gallery.cold-moon-d65c.workers.dev';
  var FS = 'https://firestore.googleapis.com/v1/projects/fom-studios/databases/(default)/documents/siteContent/';
  var KEY = 'AIzaSyCbRXQmIxzVWuFS0CRmDY33qYuzpcVL80A';
  var id = (location.search.match(/[?&]b=([a-z0-9]+)/) || [])[1] || '';
  var app = document.getElementById('app');
  function esc(t){ return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fromValue(v){ if(!v) return null; if('stringValue' in v) return v.stringValue; if('booleanValue' in v) return v.booleanValue; if('integerValue' in v) return +v.integerValue; if('doubleValue' in v) return v.doubleValue;
    if('arrayValue' in v) return (v.arrayValue.values || []).map(fromValue);
    if('mapValue' in v){ var o = {}, f = v.mapValue.fields || {}; for(var k in f) o[k] = fromValue(f[k]); return o; } return null; }
  function doc(name){ return fetch(FS + name + '?key=' + KEY).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){ if(!j || !j.fields) return null; var o = {}; for(var k in j.fields) o[k] = fromValue(j.fields[k]); return o; }).catch(function(){ return null; }); }

  /* ---------- per business ---------- */
  var BIZ = {
    fom:{ name:'FOM Studios', logo:'assets/logo-dark.png', site:'https://www.fomstudios.co.za/', siteDoc:'site', pfDoc:'portfolio',
      cards:[ { id:'wedding', label:'Wedding', icon:'💍' }, { id:'party', label:'Birthday / Party', icon:'🎉' }, { id:'corporate', label:'Corporate / Event', icon:'🏢' },
              { id:'family', label:'Family / Portrait', icon:'📸' }, { id:'product', label:'Product / Brand', icon:'📦' }, { id:'sports', label:'Sports', icon:'⚽' } ],
      pkgs:[ { id:'mini', name:'Mini Shoot', detail:'30 minutes, 20 photos or 1 reel', price:'R500' },
        { id:'pb', name:'Photography Bronze', detail:'2 hours, 30-40 photos', price:'R800' }, { id:'ps', name:'Photography Silver', detail:'4 hours, 40-50 photos', price:'R1300' }, { id:'pg', name:'Photography Gold', detail:'6 hours, 50-60 photos', price:'R1800' },
        { id:'vb', name:'Videography Bronze', detail:'2 hours, 1 reel', price:'R1000' }, { id:'vs', name:'Videography Silver', detail:'4 hours, 2 reels', price:'R1700' }, { id:'vg', name:'Videography Gold', detail:'6 hours, 2 reels and drone', price:'R3000' },
        { id:'cb', name:'Photo & Video Bronze', detail:'2 hours, photos and 1 reel', price:'R1500' }, { id:'cs', name:'Photo & Video Silver', detail:'4 hours, photos and 2 reels', price:'R2700' }, { id:'cg', name:'Photo & Video Gold', detail:'6 hours, photos, reels and drone', price:'R4500' },
        { id:'padel', name:'Padel League', detail:'Game day reel and photos every week', price:'R2500/wk', only:['sports'] } ],
      showPrices:true },
    sba:{ name:'Shot by A', logo:'shotbya/logo.png', site:'https://www.fomstudios.co.za/shotbya/', siteDoc:'site_sba', pfDoc:'portfolio_sba',
      cards:[ { id:'events', label:'Event', icon:'🎈' }, { id:'birthdays', label:'Birthday', icon:'🎂' }, { id:'corporate', label:'Corporate & wellness', icon:'🧘' }, { id:'family', label:'Family & portraits', icon:'👨‍👩‍👧' } ],
      pkgs:[] }
  };
  var LENGTHS = ['1 hour','2 hours','Half day','Full day','Not sure'];
  var GUESTS = ['Just us','Under 20','20 to 50','50 to 100','100+'];
  var VIBES = ['Bright and natural','Moody and cinematic','Candid and fun','Classic and posed'];
  var USES = ['Instagram','TikTok','Website','Ads','LinkedIn','Print'];
  var MUST = [
    [/wed/i, ['Getting ready','Ceremony','Rings','First kiss','Family groups','Couple portraits','First dance','Speeches','Decor and details']],
    [/birth|party/i, ['Cake and candles','Decor','Guests arriving','Group photos','Games and dancing','Gifts','Candid moments']],
    [/corp|event|well/i, ['Speakers','Branding and banners','Networking candids','Team photo','Headshots','Venue and decor','Highlight reel']],
    [/fam|portrait/i, ['Whole family','Kids on their own','Parents','Siblings','Candid play','Pets']],
    [/prod|brand/i, ['Product close-ups','Lifestyle in use','Flat lays','Behind the scenes','Team at work','Short reels']],
    [/sport|padel/i, ['Action shots','Team photo','Celebrations','Supporters','Coach and bench','Individual players','Highlight reel']]
  ];
  var B = BIZ.fom, info = null, photos = [], A = {}, step = 1, TOTAL = 6, sending = false;
  var LS = 'fom.brief.' + id;

  function card(){ var c = B.cards.filter(function(x){ return x.label === A.type; })[0]; return c || (A.type ? { id:'other', label:A.type } : null); }
  function mustFor(){ var t = (card() || {}).id + ' ' + (A.type || ''); for(var i = 0; i < MUST.length; i++) if(MUST[i][0].test(t)) return MUST[i][1]; return ['Group photos','Candids','Details and decor','Highlight reel']; }
  function brandish(){ return /prod|brand|corp|sport|padel|well/i.test((card() || {}).id + ' ' + (A.type || '')); }
  function pkgsFor(){ var c = card(); return B.pkgs.filter(function(p){ return !p.only || !p.only.length || (c && p.only.indexOf(c.id) >= 0); }); }
  function keep(){ try{ localStorage.setItem(LS, JSON.stringify({ A:A, step:step })); }catch(e){} }
  function toggle(k, v){ var a = A[k] = (A[k] || []).slice(), i = a.indexOf(v); if(i >= 0) a.splice(i, 1); else a.push(v); }

  /* ---------- screens ---------- */
  function nav(canNext, last){
    return '<div class="err" id="err"></div><div class="nav">' + (step > 1 ? '<button class="btn ghost" data-go="back" aria-label="Back">&#8592;</button>' : '') +
      '<button class="btn" data-go="' + (last ? 'send' : 'next') + '"' + (canNext === false ? ' disabled' : '') + '>' + (last ? (sending ? 'Sending...' : 'Send my brief ✓') : 'Next') + '</button></div>' +
      (!last && step > 1 ? '<div style="text-align:center"><button class="skip" data-go="next">Skip this one</button></div>' : '');
  }
  function render(){
    document.getElementById('bar').style.width = (A.__done ? 100 : Math.round((step - 1) / TOTAL * 100)) + '%';
    document.getElementById('time').textContent = A.__done ? '' : 'Step ' + step + ' of ' + TOTAL;
    var h = '', first = info && info.name ? esc(info.name) : '';
    if(A.__done){
      h = '<div class="card done"><div class="ic">🎉</div><h1>Thanks' + (first ? ', ' + first : '') + '!</h1><p class="sub">Got everything. I\'ll send your quote on WhatsApp soon.</p>' +
        '<a class="btn" href="' + B.site + '">Visit our website</a><div><button class="skip" data-go="edit">Change my answers</button></div></div>';
    } else if(step === 1){
      h = '<div class="card"><h1>Hi' + (first ? ' ' + first : '') + ' 👋</h1><p class="sub">A few quick taps so I can send you the right quote. Skip anything you\'re not sure about.</p>' +
        '<h2>What are we shooting?</h2><div class="grid">' + B.cards.map(function(c){ return '<button class="opt' + (A.type === c.label ? ' on' : '') + '" data-type="' + esc(c.label) + '"><span class="ic">' + esc(c.icon || '📷') + '</span><b>' + esc(c.label) + '</b></button>'; }).join('') +
        '<button class="opt' + (A.type && !B.cards.some(function(c){ return c.label === A.type; }) ? ' on' : '') + '" data-type="Something else"><span class="ic">✨</span><b>Something else</b></button></div>' + nav(!!A.type) + '</div>';
    } else if(step === 2){
      var P = pkgsFor();
      h = '<div class="card"><h1>What do you have in mind?</h1><p class="sub">' + (P.length ? 'Pick the closest one, or "Not sure" and I\'ll help.' : 'Roughly how long should I be there?') + '</p>' +
        (P.length ? '<div class="grid">' + P.map(function(p){ return '<button class="opt' + (A.pkg === p.name ? ' on' : '') + '" data-pkg="' + esc(p.name) + '"><b>' + esc(p.name) + '</b><small>' + esc(p.detail || '') + '</small>' + (B.showPrices && p.price ? '<span class="pr">' + esc(p.price) + '</span>' : '') + '</button>'; }).join('') +
          '<button class="opt' + (A.pkg === 'Not sure' ? ' on' : '') + '" data-pkg="Not sure"><b>Not sure</b><small>Help me choose</small></button></div>'
          : '<div class="chips">' + LENGTHS.map(function(l){ return '<button class="chip' + (A.length === l ? ' on' : '') + '" data-one="length" data-v="' + l + '">' + l + '</button>'; }).join('') + '</div>' +
            '<h2>Photos, video or both?</h2><div class="chips">' + ['Photos','Video','Both'].map(function(l){ return '<button class="chip' + (A.cover === l ? ' on' : '') + '" data-one="cover" data-v="' + l + '">' + l + '</button>'; }).join('') + '</div>') +
        nav() + '</div>';
    } else if(step === 3){
      h = '<div class="card"><h1>When and where?</h1><p class="sub">Not locked in yet? That\'s fine, skip what you don\'t know.</p>' +
        '<h2>Date</h2><div class="field"><input type="date" id="fDate" value="' + esc(/^\d{4}-/.test(A.date || '') ? A.date : '') + '"></div>' +
        '<div class="chips" style="margin-top:8px"><button class="chip' + (A.date === 'Not sure yet' ? ' on' : '') + '" data-one="date" data-v="Not sure yet">Not sure yet</button></div>' +
        '<h2>Start time</h2><div class="field"><input type="time" id="fTime" value="' + esc(A.time || '') + '"></div>' +
        '<h2>Area or venue</h2><div class="field"><input id="fArea" maxlength="100" placeholder="e.g. Sandton, or the venue name" value="' + esc(A.area || '') + '"></div>' +
        '<h2>How many people?</h2><div class="chips">' + GUESTS.map(function(l){ return '<button class="chip' + (A.guests === l ? ' on' : '') + '" data-one="guests" data-v="' + l + '">' + l + '</button>'; }).join('') + '</div>' + nav() + '</div>';
    } else if(step === 4){
      h = '<div class="card"><h1>Any must-have shots?</h1><p class="sub">Tap all that matter to you.</p><div class="chips">' +
        mustFor().map(function(l){ return '<button class="chip' + ((A.must || []).indexOf(l) >= 0 ? ' on' : '') + '" data-many="must" data-v="' + esc(l) + '">' + esc(l) + '</button>'; }).join('') + '</div>' +
        (brandish() ? '<h2>Where will you use it?</h2><div class="chips">' + USES.map(function(l){ return '<button class="chip' + ((A.use || []).indexOf(l) >= 0 ? ' on' : '') + '" data-many="use" data-v="' + l + '">' + l + '</button>'; }).join('') + '</div>' +
          '<h2>Vertical videos for phones?</h2><div class="chips">' + ['Yes','No','Not sure'].map(function(l){ return '<button class="chip' + (A.vertical === l ? ' on' : '') + '" data-one="vertical" data-v="' + l + '">' + l + '</button>'; }).join('') + '</div>' : '') + nav() + '</div>';
    } else if(step === 5){
      h = '<div class="card"><h1>What look do you love?</h1><p class="sub">Pick a vibe' + (photos.length ? ', then tap any of our photos you like' : '') + '.</p><div class="chips">' +
        VIBES.map(function(l){ return '<button class="chip' + ((A.vibe || []).indexOf(l) >= 0 ? ' on' : '') + '" data-many="vibe" data-v="' + l + '">' + l + '</button>'; }).join('') + '</div>' +
        (photos.length ? '<h2>Photos you like</h2><div class="photos">' + photos.map(function(p){ return '<button class="ph' + ((A.photos || []).indexOf(p.u) >= 0 ? ' on' : '') + '" data-ph="' + esc(p.u) + '" aria-label="' + esc(p.cap || 'Photo') + '"><img src="' + esc(p.u) + '" alt="" loading="lazy" onerror="this.parentNode.style.display=\'none\'"><span class="tick">✓</span></button>'; }).join('') + '</div>' : '') + nav() + '</div>';
    } else {
      h = '<div class="card"><h1>Anything else I should know?</h1><p class="sub">Ideas, timings, the feel you\'re going for. Optional.</p><div class="field"><textarea id="fNote" rows="5" maxlength="800" placeholder="e.g. Surprise party, guests arrive at 2, the speech is at 4">' + esc(A.note || '') + '</textarea></div>' + nav(true, true) + '</div>';
    }
    app.innerHTML = h;
    window.scrollTo(0, 0);
  }
  function grab(){
    var d = document.getElementById('fDate'), t = document.getElementById('fTime'), a = document.getElementById('fArea'), n = document.getElementById('fNote');
    if(d && d.value) A.date = d.value;
    if(t) A.time = t.value; if(a) A.area = a.value.trim(); if(n) A.note = n.value.trim();
  }
  app.addEventListener('input', function(e){ if(e.target.id === 'fDate' && e.target.value){ A.date = e.target.value; var c = app.querySelector('[data-v="Not sure yet"]'); if(c) c.classList.remove('on'); } grab(); keep(); });
  app.addEventListener('click', function(e){
    var t = e.target.closest('button'); if(!t) return;
    if(t.dataset.type){ A.type = t.dataset.type; keep(); render(); return; }
    if(t.dataset.pkg){ A.pkg = A.pkg === t.dataset.pkg ? '' : t.dataset.pkg; keep(); render(); return; }
    if(t.dataset.one){ grab(); A[t.dataset.one] = A[t.dataset.one] === t.dataset.v ? '' : t.dataset.v; if(t.dataset.one === 'date' && A.date === 'Not sure yet'){ var d = document.getElementById('fDate'); if(d) d.value = ''; } keep(); render(); return; }
    if(t.dataset.many){ grab(); toggle(t.dataset.many, t.dataset.v); keep(); t.classList.toggle('on'); return; }
    if(t.dataset.ph){ toggle('photos', t.dataset.ph); keep(); t.classList.toggle('on'); return; }
    var g = t.dataset.go; if(!g) return;
    grab();
    if(g === 'back'){ step = Math.max(1, step - 1); keep(); render(); }
    else if(g === 'next'){ if(step === 1 && !A.type) return; step = Math.min(TOTAL, step + 1); keep(); render(); }
    else if(g === 'edit'){ delete A.__done; step = 1; keep(); render(); }
    else if(g === 'send') send();
  });
  function send(){
    if(sending) return; sending = true; render();
    var out = {}; Object.keys(A).forEach(function(k){ if(k.indexOf('__') !== 0) out[k] = A[k]; });
    fetch(WORKER + '/brief/send?id=' + id, { method:'POST', headers:{ 'Content-Type':'text/plain' }, body:JSON.stringify({ answers:out }) })
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || 'Could not send'); }); })
      .then(function(){ sending = false; A.__done = 1; keep(); render(); })
      .catch(function(e){ sending = false; render(); var x = document.getElementById('err'); if(x) x.textContent = (e.message || 'Could not send') + '. Please check your signal and try again.'; });
  }
  function fail(msg){ app.innerHTML = '<div class="card done"><div class="ic">🔗</div><h1>Link not found</h1><p class="sub">' + esc(msg) + '</p><a class="btn" href="' + B.site + '">Visit our website</a></div>'; document.getElementById('time').textContent = ''; }

  /* ---------- start ---------- */
  if(!id){ fail('This link is missing a part. Please ask for a new one on WhatsApp.'); return; }
  fetch(WORKER + '/brief/get?id=' + id).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || 'Not found'); return j; }); }).then(function(j){
    info = j; B = BIZ[j.biz] || BIZ.fom;
    if(j.biz === 'sba'){
      document.body.classList.add('sba');
      var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap'; document.head.appendChild(l);
      document.querySelector('meta[name=theme-color]').content = '#F3F2EC';
    }
    var lg = document.getElementById('logo'); lg.src = B.logo; lg.alt = B.name;
    document.title = 'Your shoot brief · ' + B.name;
    document.getElementById('foot').textContent = B.name + ' · Johannesburg';
    var saved = null; try{ saved = JSON.parse(localStorage.getItem(LS)); }catch(e){}
    if(saved && saved.A){ A = saved.A; step = saved.step || 1; }
    else if(j.answers){ A = j.answers; A.__done = 1; }
    if(!A.type && j.type){ A.type = (B.cards.filter(function(c){ return c.label.toLowerCase() === String(j.type).toLowerCase(); })[0] || {}).label || j.type; }
    if(j.done && !A.__done && !saved) A.__done = 1;
    render();
    // the latest cards, packages and photos from the Website and Photos pages
    doc(B.siteDoc).then(function(s){
      var f = s && s.bookingForm; if(!f || typeof f !== 'object') return;
      if(Array.isArray(f.cards)){ var c = f.cards.filter(function(x){ return x && x.label && !x.off; }); if(c.length) B.cards = c; }
      if(Array.isArray(f.pkgs)){ var p = f.pkgs.filter(function(x){ return x && x.name && !x.off; }); if(p.length) B.pkgs = p; }
      if(f.showPrices === false) B.showPrices = false;
      if(step <= 2 && !A.__done) render();
    });
    doc(B.pfDoc).then(function(d){
      var a; try{ a = JSON.parse(d && d.json); }catch(e){ return; } if(!Array.isArray(a)) return;
      var src = function(s){ s = String(s || ''); if(s.indexOf('r2:') === 0 && /^[a-z0-9._-]+$/i.test(s.slice(3))) return WORKER + '/file?g=portfolio%2F&n=' + encodeURIComponent(s.slice(3)); if(/^https:\/\//.test(s)) return s; if(/^assets\/[A-Za-z0-9._-]+$/.test(s)) return location.origin + '/' + s; return ''; };
      var list = a.filter(function(p){ return p && !p.hide && src(p.src); }).map(function(p){ return { u:src(p.src), cap:String(p.cap || ''), cat:p.cat || '', home:!!p.home }; });
      var k = (card() || {}).id || '', want = /sport|padel/.test(k) ? 'sports' : k;
