<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>FOM Studios | Your Gallery</title>
<link rel="icon" type="image/png" href="assets/mascot-head-color.jpg">
<link rel="apple-touch-icon" href="assets/mascot-head-color.jpg">
<style>
/* ===== FOM theme (cream, navy accent) ===== */
:root{
  --bg:#f1f0ec; --panel:#fafaf9; --panel-2:#eeece6; --line:#dcdad3;
  --ink:#2a2b2c; --ink-soft:#6f6f6d; --ink-dim:#9a9895;
  --accent:#02367B; --accent-2:#5B9AE0; --on-accent:#ffffff;
  --radius:18px; --radius-sm:12px; --gutter:clamp(18px,5vw,56px);
  --container:1280px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{max-width:100%;overflow-x:hidden;}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
img,video{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;}
.wrap{max-width:var(--container);margin:0 auto;padding:0 var(--gutter);}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700;}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:700;font-size:13.5px;
  background:var(--accent);color:var(--on-accent);transition:transform .12s,opacity .2s;white-space:nowrap;}
.btn:active{transform:scale(.97);} .btn:hover{opacity:.92;}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
.btn.ghost:hover{border-color:var(--ink);}
.btn svg{width:17px;height:17px;} .btn.sm{height:38px;padding:0 15px;font-size:12.5px;}

/* ===== top bar ===== */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px var(--gutter);background:rgba(250,250,249,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.topbar .mark{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.1em;font-size:14px;text-transform:uppercase;color:var(--ink);}
.topbar .mark img{width:36px;height:36px;border-radius:50%;object-fit:contain;padding:3px;background:#fff;box-shadow:0 0 0 1px var(--line);}

/* ===== hero (image band with light fade into the page) ===== */
.hero{position:relative;min-height:clamp(380px,62vh,600px);display:flex;align-items:flex-end;overflow:hidden;background:#15161a;}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;}
.hero .bg{filter:brightness(.72) saturate(.9);}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,15,18,.72) 0%,rgba(14,15,18,.45) 45%,rgba(14,15,18,.12) 100%),linear-gradient(180deg,rgba(14,15,18,.35) 0%,rgba(14,15,18,.3) 35%,rgba(14,15,18,.8) 84%,var(--bg) 100%);}
@media(max-width:640px){.hero .scrim{background:linear-gradient(180deg,rgba(14,15,18,.5) 0%,rgba(14,15,18,.55) 35%,rgba(14,15,18,.85) 84%,var(--bg) 100%);}}
.hero .inner{position:relative;z-index:2;width:100%;padding:0 var(--gutter) clamp(26px,5vw,52px);max-width:var(--container);margin:0 auto;}
.hero .eyebrow{color:#bcd4f5;}
.hero h1{font-size:clamp(38px,9vw,84px);font-weight:800;line-height:.98;letter-spacing:-.02em;text-transform:uppercase;color:#fff;margin:10px 0 0;text-shadow:0 2px 24px rgba(0,0,0,.5);}
.hero h1 .accent{color:#8fb8e8;display:block;}
.hero .sub{color:rgba(255,255,255,.94);font-size:clamp(14px,2.4vw,16px);margin-top:14px;max-width:44ch;text-shadow:0 1px 12px rgba(0,0,0,.55);}
.hero .rule{height:1px;background:rgba(255,255,255,.25);margin:22px 0 16px;max-width:520px;}
.meta{display:flex;flex-wrap:wrap;gap:clamp(20px,6vw,54px);}
.meta .m .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:700;}
.meta .m .v{font-size:16px;font-weight:800;margin-top:4px;letter-spacing:.02em;color:#fff;}
.meta .m .v.hi{color:#8fb8e8;}
.meta .m .v.exp{color:#ffb4ae;}
.meta .m .v small{display:block;font-size:11.5px;font-weight:600;letter-spacing:.03em;color:#ffb4ae;opacity:.85;margin-top:2px;}
.topbar .tb-r{display:flex;align-items:center;gap:8px;}
.topbar .back{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;}
.topbar .back:hover{border-color:var(--ink);}

/* ===== library toolbar ===== */
.lib{padding-top:clamp(28px,6vw,52px);}
.lib-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
.lib-head h2{font-size:clamp(26px,5vw,44px);font-weight:800;letter-spacing:-.01em;text-transform:uppercase;margin-top:8px;}
.lib-head .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.tabs{display:flex;gap:8px;}
.tab{height:38px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-soft);border:1px solid var(--line);background:var(--panel);transition:.15s;}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.tab .n{opacity:.6;margin-left:6px;}

/* ===== grid ===== */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:4px;}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}}
@media(min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;}}
.more{display:flex;flex-direction:column;align-items:center;gap:12px;margin:26px 0 4px;color:var(--ink-soft);font-size:13px;}
.more .mb{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.more .rv{font-size:13px;color:var(--ink-soft);}
.more .rv a{color:var(--accent);font-weight:700;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .2s;}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -16px rgba(0,0,0,.35);}
.card .thumb{position:relative;aspect-ratio:1/1;background:var(--panel-2);overflow:hidden;}
.card .thumb img,.card .thumb video{width:100%;height:100%;object-fit:cover;}
.card .thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-dim);font-size:34px;}
.badge{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;
  background:rgba(20,21,24,.72);backdrop-filter:blur(6px);font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;}
.badge svg{width:12px;height:12px;}
.dl-mini{position:absolute;top:7px;right:7px;width:34px;height:34px;border-radius:50%;background:rgba(20,21,24,.72);backdrop-filter:blur(6px);
  display:grid;place-items:center;color:#fff;transition:background .2s;}
.dl-mini:hover{background:var(--accent);}
/* download progress sheet */
.dl-scrim{position:fixed;inset:0;z-index:300;background:rgba(10,10,12,.55);display:none;align-items:flex-end;justify-content:center;}
.dl-scrim.on{display:flex;}
.dl-box{background:var(--panel);color:var(--ink);width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:22px 20px calc(18px + var(--safe-b));box-shadow:0 -10px 40px rgba(0,0,0,.25);}
@media(min-width:600px){.dl-scrim{align-items:center;}.dl-box{border-radius:22px;}}
.dl-h{font-size:18px;font-weight:800;}
.dl-sub{font-size:13.5px;color:var(--ink-soft);margin:6px 0 12px;min-height:18px;word-break:break-word;}
.dl-bar{height:8px;border-radius:9px;background:var(--panel-2);overflow:hidden;}
.dl-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width .2s;}
.dl-acts{display:flex;gap:10px;margin-top:16px;} .dl-acts .btn{flex:1;justify-content:center;}
.dl-note{font-size:12.5px;color:var(--ink-soft);margin-top:10px;line-height:1.5;} .dl-note a{color:var(--accent);font-weight:700;}
button.btn{cursor:pointer;}
/* favourites */
.fav{position:absolute;right:7px;bottom:7px;width:36px;height:36px;border-radius:50%;background:rgba(20,21,24,.6);backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff;transition:transform .15s,background .2s;z-index:2;}
.fav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;}
.fav.on{background:#fff;color:#e0245e;}
.fav.on svg{fill:currentColor;}
.fav.pop{animation:favpop .3s ease;}
@keyframes favpop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.lb-fav{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;}
.lb-fav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;}
.lb-fav.on{background:#fff;color:#e0245e;} .lb-fav.on svg{fill:currentColor;}
.lb-th .h{position:absolute;right:3px;top:2px;color:#ff4d7d;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6);}
.fav-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:0 0 14px;font-size:13.5px;color:var(--ink-soft);}
.fav-bar b{color:var(--ink);} .fav-bar .heart{color:#e0245e;}
.fav-bar .st{margin-left:auto;font-size:12.5px;}
.fav-bar .st.ok{color:#1f8a4c;} .fav-bar .st.warn{color:#b0640b;}
.fav-empty{grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:40px 10px;font-size:14px;line-height:1.7;}
@keyframes favpop2{0%{transform:scale(.6);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:0}}
.big-heart{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;color:#fff;pointer-events:none;animation:favpop2 .7s ease forwards;filter:drop-shadow(0 4px 14px rgba(0,0,0,.4));}
.dl-mini svg{width:16px;height:16px;}
.play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;}
.play span{width:54px;height:54px;border-radius:50%;background:rgba(20,21,24,.5);backdrop-filter:blur(4px);display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.6);}
.play span svg{width:20px;height:20px;margin-left:3px;fill:#fff;}
.card .cap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;}
.card .cap .nm{font-size:12.5px;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .cap .sz{font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap;}

/* ===== thank you / footer ===== */
.thanks{margin-top:clamp(40px,8vw,84px);border-top:1px solid var(--line);padding:clamp(40px,7vw,70px) 0 0;text-align:center;}
.thanks .mascot{width:84px;height:84px;border-radius:50%;object-fit:contain;padding:8px;background:#fff;box-shadow:0 10px 26px -10px rgba(0,0,0,.35);margin:0 auto 20px;display:block;}
.thanks .big{font-size:clamp(30px,6vw,50px);font-weight:800;text-transform:uppercase;letter-spacing:-.01em;}
.thanks p{color:var(--ink-soft);max-width:52ch;margin:16px auto 0;font-size:15px;line-height:1.7;}
.thanks .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px;}
.foot{margin-top:clamp(44px,8vw,78px);padding:26px var(--gutter) calc(30px + var(--safe-b));border-top:1px solid var(--line);text-align:center;color:var(--ink-dim);font-size:12.5px;}
.foot .fb{font-weight:800;letter-spacing:.12em;color:var(--ink);text-transform:uppercase;margin-bottom:6px;}
.foot a{color:var(--accent);font-weight:600;}

/* ===== states ===== */
.state{min-height:62vh;display:grid;place-items:center;text-align:center;padding:40px var(--gutter);}
.state .box{max-width:440px;} .state .box .mascot{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#fff;margin:0 auto 16px;display:block;box-shadow:0 8px 22px -10px rgba(0,0,0,.4);}
.state h3{font-size:22px;font-weight:800;margin-bottom:8px;} .state p{color:var(--ink-soft);font-size:14.5px;line-height:1.7;}
.hidden{display:none!important;}

/* ===== lightbox (dark media viewer) ===== */
.lb{position:fixed;inset:0;z-index:200;background:#121316;display:none;flex-direction:column;}
.lb.on{display:flex;}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px var(--gutter);color:#fff;}
.lb-top .info .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw;}
.lb-top .info .sz{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px;}
.lb-top .acts{display:flex;gap:10px;align-items:center;}
.lb-x{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;font-size:22px;line-height:1;}
.lb-stage{flex:1;position:relative;display:grid;place-items:center;padding:0 clamp(8px,4vw,64px);min-height:0;}
.lb-stage img{max-width:100%;max-height:calc(100dvh - 190px);object-fit:contain;border-radius:8px;}
.lb-stage video{max-width:100%;max-height:calc(100dvh - 190px);border-radius:8px;background:#000;}
.lb-stage .novid{text-align:center;color:rgba(255,255,255,.75);}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;font-size:24px;}
.lb-nav:hover{background:var(--accent);}
.lb-prev{left:10px;}.lb-next{right:10px;}
.lb-count{text-align:center;padding:10px 14px 6px;color:rgba(255,255,255,.7);font-size:12.5px;letter-spacing:.1em;}
.lb-stage{overflow:hidden;touch-action:pan-y;}
#lbMedia{display:grid;place-items:center;will-change:transform;}
#lbMedia.slide{transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .26s;}
/* progress + thumbnail strip */
.lb-prog{height:3px;background:rgba(255,255,255,.14);margin:0 var(--gutter);border-radius:9px;overflow:hidden;}
.lb-prog i{display:block;height:100%;width:0;background:var(--accent-2,#5B9AE0);border-radius:9px;transition:width .25s;}
.lb-strip{display:flex;gap:6px;overflow-x:auto;padding:10px var(--gutter) calc(14px + var(--safe-b));scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.lb-strip::-webkit-scrollbar{display:none;}
.lb-th{flex:none;width:54px;height:54px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.08);border:0;padding:0;opacity:.45;transition:opacity .2s,transform .2s,outline-color .2s;outline:2px solid transparent;outline-offset:-2px;position:relative;cursor:pointer;}
.lb-th img{width:100%;height:100%;object-fit:cover;}
.lb-th .v{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:16px;}
.lb-th.on{opacity:1;outline-color:#fff;transform:scale(1.06);}
.lb-th:hover{opacity:.85;}
@media(min-width:900px){.lb-th{width:66px;height:66px;}}
@media(max-height:560px){.lb-strip{display:none;}}
@media(max-width:640px){.lb-nav{width:40px;height:40px;font-size:20px;}}
</style>
<script src="brand-client.js"></script>
</head>
<body>

<div id="app"></div>

<!-- LIGHTBOX -->
<div class="lb" id="lb" role="dialog" aria-modal="true">
  <div class="lb-top">
    <div class="info"><div class="nm" id="lbName"></div><div class="sz" id="lbSize"></div></div>
    <div class="acts">
      <button class="lb-fav" id="lbFav" type="button" aria-label="Add to favourites"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 2.9 5 6.4 5c2.1 0 3.6 1.2 4.6 2.6C12 6.2 13.5 5 15.6 5 19.1 5 21 8.6 19.6 11.8 17.5 16.4 12 21 12 21z"/></svg></button>
      <button class="btn sm" id="lbDl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>Download</button>
      <button class="lb-x" id="lbClose" aria-label="Close">&times;</button>
    </div>
  </div>
  <div class="lb-stage" id="lbStage">
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">&#8249;</button>
    <div id="lbMedia"></div>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Next">&#8250;</button>
  </div>
  <div class="lb-count" id="lbCount"></div>
  <div class="lb-prog" aria-hidden="true"><i id="lbProg"></i></div>
  <div class="lb-strip" id="lbStrip" aria-label="All files"></div>
</div>

<script>
/* ============================================================
   FOM STUDIOS, Client gallery (reads file list from the R2 Worker).
   Opens in DEMO mode (sample tiles) when no Worker/params are set.
   ============================================================ */
const CONFIG = {
  worker:      'https://fom-gallery.cold-moon-d65c.workers.dev', // blank = demo mode
  banner:      'assets/email-hero.png',                       // fixed FOM hero banner (swap for your branded image)
  mascot:      'assets/mascot-head-color.jpg',
  reviewUrl:   'feedback.html',                               // your own feedback form (or an external http(s) link)
  reviewLabel: 'Leave a review',
  feedbackUrl: '',                                            // optional second button (e.g. a Google Form)
  feedbackLabel:'Share feedback',
  site:'www.fomstudios.co.za', email:'info@fomstudios.co.za', phone:'073 755 3136',
  instagram:'https://instagram.com/fom_studios_'
};

/* Shot by A: her details and a plain branded hero until she has her own banner photo */
if(window.FOM_CLIENT && FOM_CLIENT.id === 'sba') Object.assign(CONFIG, { banner:'', mascot:'shotbya/logo.png', site:FOM_CLIENT.site, email:FOM_CLIENT.email, instagram:'https://instagram.com/' + FOM_CLIENT.instagram, reviewUrl:'feedback.html' });
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const GAL = {
  folder: P.get('g') || '',
  name:   P.get('name') || 'there',
  date:   P.get('date') || '',
  expiry: P.get('expiry') || '',
  dl:     P.get('dl') || '',
  order:  P.get('o') || ''        // the booking, so favourites can be sent to FOM Studios
};

const VIDEO_EXT=['mp4','webm','m4v','ogg','mov','avi','mkv'], PLAYABLE=['mp4','webm','m4v','ogg'], IMAGE_EXT=['jpg','jpeg','png','webp','gif','avif','bmp'];
const ext=n=>(n.split('.').pop()||'').toLowerCase();
const kindOf=n=>VIDEO_EXT.includes(ext(n))?'video':IMAGE_EXT.includes(ext(n))?'image':'file';
const playable=n=>PLAYABLE.includes(ext(n));
function fmtSize(b){b=+b||0;if(b>=1e9)return(b/1e9).toFixed(2)+' GB';if(b>=1e6)return(b/1e6).toFixed(1)+' MB';if(b>=1e3)return(b/1e3).toFixed(0)+' KB';return b+' B';}
function niceDate(s){if(!s)return'';try{const d=new Date(s.length<=10?s+'T00:00:00':s);return d.toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'});}catch(e){return s;}}
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

let ITEMS=[], FILTER='all';

function demoItems(){const A=n=>'assets/'+n;return[
  {name:'FOM_Hero_01.jpg',size:9400000,kind:'image',url:A('email-hero.png')},
  {name:'FOM_0421.jpg',size:6200000,kind:'image',url:A('mascot-head-color.jpg')},
  {name:'FOM_0422.jpg',size:5800000,kind:'image',url:A('mascot-head-gold.jpg')},
  {name:'FOM_0423.jpg',size:5100000,kind:'image',url:A('mascot-head-silver.jpg')},
  {name:'FOM_0424.jpg',size:4700000,kind:'image',url:A('mascot-head-bronze.jpg')},
  {name:'Detail_logo.jpg',size:3300000,kind:'image',url:A('logo.png')},
  {name:'Behind_scenes.jpg',size:4200000,kind:'image',url:A('mascot.png')},
  {name:'Highlight_Reel.mp4',size:88000000,kind:'video',url:'',poster:A('email-hero.png')}
];}

async function load(){
  if(GAL.expiry){const exp=new Date(GAL.expiry+'T23:59:59');if(new Date()>exp)return renderExpired();}
  if(CONFIG.worker && GAL.folder){
    try{
      const r=await fetch(CONFIG.worker.replace(/\/$/,'')+'/list?g='+encodeURIComponent(GAL.folder));
      if(!r.ok)throw 0;
      const data=await r.json();
      ITEMS=(data.files||data||[]).map(f=>({name:f.name,size:f.size,url:f.url,poster:f.poster,kind:f.kind||kindOf(f.name)}))
        .filter(f=>f.kind==='image'||f.kind==='video');   // only show photos/videos, never contracts, invoices or zips in the same folder
      if(!ITEMS.length)return renderEmpty();

/* ===== downloads that save straight away (no preview tab) =====
   iPhone / iPad: the files are fetched, then one tap opens the share sheet with "Save Image" / "Save to Photos".
   Android: each file downloads straight into the phone (Downloads / Gallery).
   Computer: one file downloads directly; Download all builds a single .zip in the browser.
   Files come from the R2 Worker, which allows cross-site fetches, so nothing new is needed on the server. */
const UA = navigator.userAgent;
const IS_IOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/i.test(UA);
const MIME = { jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', webp:'image/webp', gif:'image/gif', heic:'image/heic', avif:'image/avif', mp4:'video/mp4', mov:'video/quicktime', m4v:'video/mp4', webm:'video/webm' };
const fileUrl = it => it.url + (it.url.includes('?') ? '&' : '?') + 'dl=1';
function canShareFiles(){ try{ return !!(navigator.canShare && navigator.canShare({ files:[ new File(['x'], 'x.jpg', { type:'image/jpeg' }) ] })); }catch(e){ return false; } }
const USE_SHARE = IS_IOS && canShareFiles();
async function getFile(it, signal, onProgress){
  const r = await fetch(fileUrl(it), { signal });
  if(!r.ok) throw new Error('Could not get ' + it.name + ' (' + r.status + ')');
  const total = +r.headers.get('content-length') || +it.size || 0;
  if(!r.body || !onProgress){ const b = await r.blob(); return new File([b], it.name, { type: MIME[ext(it.name)] || b.type || 'application/octet-stream' }); }
  const rd = r.body.getReader(), parts = []; let got = 0;
  for(;;){ const { done, value } = await rd.read(); if(done) break; parts.push(value); got += value.length; onProgress(got, total); }
  return new File(parts, it.name, { type: MIME[ext(it.name)] || 'application/octet-stream' });
}
function saveBlob(file, name){
  const u = URL.createObjectURL(file), a = document.createElement('a');
  a.href = u; a.download = name || file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}

/* ---- progress sheet ---- */
let DLC = null;   // AbortController of the running job
function dlSheet(){
  let el = $('dlSheet'); if(el) return el;
  el = document.createElement('div'); el.id = 'dlSheet'; el.className = 'dl-scrim';
  el.innerHTML = `<div class="dl-box" role="dialog" aria-modal="true" aria-labelledby="dlT"><div class="dl-h" id="dlT">Preparing your files</div>
    <div class="dl-sub" id="dlS"></div><div class="dl-bar"><i id="dlBar"></i></div>
    <div class="dl-acts"><button class="btn" type="button" id="dlGo" hidden></button><button class="btn ghost" type="button" id="dlX">Cancel</button></div>
    <div class="dl-note" id="dlN"></div></div>`;
  document.body.appendChild(el);
  $('dlX').onclick = () => { if(DLC) DLC.abort(); closeDl(); };
  return el;
}
function showDl(title){ dlSheet().classList.add('on'); $('dlT').textContent = title; $('dlS').textContent = ''; $('dlBar').style.width = '0%'; $('dlGo').hidden = true; $('dlX').textContent = 'Cancel'; $('dlN').textContent = ''; }
function closeDl(){ const e = $('dlSheet'); if(e) e.classList.remove('on'); DLC = null; }
const setDl = (sub, pct) => { $('dlS').textContent = sub; if(pct != null) $('dlBar').style.width = Math.max(2, Math.min(100, pct)) + '%'; };
/* iPhone needs a fresh tap to open the share sheet, so preparing ends with a "Save" button */
function waitTap(label){ return new Promise(res => { const b = $('dlGo'); b.textContent = label; b.hidden = false; b.onclick = () => { b.hidden = true; res(); }; }); }
async function shareFiles(files){
  try{ await navigator.share({ files }); return true; }
  catch(e){ if(e && e.name === 'AbortError') return false; throw e; }
}
function failDl(err){
  console.warn('download', err);
  if(err && err.name === 'AbortError') return closeDl();
  $('dlT').textContent = 'Something went wrong';
  setDl('Check your connection and try again. ' + (err && err.message ? '(' + err.message + ')' : ''), null);
  $('dlX').textContent = 'Close'; $('dlGo').hidden = true;
  if(GAL.dl) $('dlN').innerHTML = `Or use the <a href="${esc(GAL.dl)}" target="_blank" rel="noopener">backup download link</a>.`;
}

/* ---- one file ---- */
async function download(it){
  if(!it || !it.url) return;
  if(!USE_SHARE && !IS_ANDROID && !IS_IOS){   // computer: quick direct download
    DLC = new AbortController();
    try{ showDl('Downloading'); setDl(it.name, 3);
      const f = await getFile(it, DLC.signal, (g, t) => setDl(it.name + (t ? ' · ' + Math.round(g / t * 100) + '%' : ''), t ? g / t * 100 : null));
      saveBlob(f); closeDl(); }
    catch(e){ failDl(e); }
    return;
  }
  DLC = new AbortController();
  try{
    showDl(USE_SHARE ? 'Getting your ' + (it.kind === 'video' ? 'video' : 'photo') : 'Downloading'); setDl(it.name, 3);
    const f = await getFile(it, DLC.signal, (g, t) => setDl(it.name + (t ? ' · ' + Math.round(g / t * 100) + '%' : ''), t ? g / t * 100 : null));
    if(USE_SHARE){
      $('dlT').textContent = 'Your ' + (it.kind === 'video' ? 'video' : 'photo') + ' is ready'; setDl(it.name, 100);
      $('dlN').textContent = 'Tap below, then choose "' + (it.kind === 'video' ? 'Save Video' : 'Save Image') + '" to put it in your Photos.';
      await waitTap(it.kind === 'video' ? 'Save video' : 'Save photo');
      await shareFiles([f]);
    } else saveBlob(f);
    closeDl();
  }catch(e){ failDl(e); }
}

/* ---- every file (or the current tab: All / Photos / Videos / Favourites) ---- */
async function downloadAll(){
  const list = visible().filter(i => i.url);
  if(!list.length) return;
  const label = FILTER === 'fav' ? 'favourites' : FILTER === 'image' ? 'photos' : FILTER === 'video' ? 'videos' : 'files';
  DLC = new AbortController(); const sig = DLC.signal;
  const totalBytes = list.reduce((a, i) => a + (+i.size || 0), 0) || 1;
  let doneBytes = 0;
  const pct = extra => (doneBytes + (extra || 0)) / totalBytes * 100;
  try{
    if(USE_SHARE){
      /* iPhone: batches of up to 20 files (or about 250 MB) so the share sheet and memory stay happy */
      const batches = []; let cur = [], sz = 0;
      list.forEach(i => { if(cur.length && (cur.length >= 20 || sz + (+i.size || 0) > 250e6)){ batches.push(cur); cur = []; sz = 0; } cur.push(i); sz += +i.size || 0; });
      if(cur.length) batches.push(cur);
      showDl('Saving ' + list.length + ' ' + label + ' to your Photos');
      let n = 0;
      for(let b = 0; b < batches.length; b++){
        const files = [];
        for(const it of batches[b]){
          n++; setDl('Getting ' + n + ' of ' + list.length, pct());
          files.push(await getFile(it, sig, (g) => setDl('Getting ' + n + ' of ' + list.length, pct(g))));
          doneBytes += +it.size || 0;
        }
        $('dlT').textContent = batches.length > 1 ? 'Part ' + (b + 1) + ' is ready' : 'Your ' + label + ' are ready';
        setDl(batches.length > 1 ? 'Part ' + (b + 1) + ' of ' + batches.length + ' ready (' + files.length + ' files)' : files.length + ' files ready', pct());
        $('dlN').textContent = 'Tap below, then choose "Save ' + files.length + ' Items" to put them in your Photos.';
        await waitTap(batches.length > 1 ? 'Save part ' + (b + 1) + ' of ' + batches.length : 'Save ' + files.length + ' to Photos');
        await shareFiles(files);
        $('dlN').textContent = '';
      }
      $('dlT').textContent = 'All done'; setDl('Everything is in your Photos. Enjoy!', 100); $('dlX').textContent = 'Close';
      return;
    }
    if(IS_ANDROID){
      /* Android: each file saves straight to the phone (Chrome may ask once to allow several downloads) */
      showDl('Downloading ' + list.length + ' ' + label);
      let n = 0;
      for(const it of list){
        n++; setDl('Saving ' + n + ' of ' + list.length, pct());
        saveBlob(await getFile(it, sig, (g) => setDl('Saving ' + n + ' of ' + list.length, pct(g))));
        doneBytes += +it.size || 0;
        await new Promise(r => setTimeout(r, 350));
      }
      $('dlT').textContent = 'All done'; setDl('Your ' + label + ' are in your Downloads and Gallery.', 100); $('dlX').textContent = 'Close';
      return;
    }
    /* computer: one .zip (split into parts above 2 GB) */
    showDl('Preparing your download');
    const base = (String(GAL.name || 'Gallery').trim() + ' ' + ((window.FOM_CLIENT && FOM_CLIENT.name) || 'FOM Studios')).replace(/[^\w\- ]+/g, '').replace(/\s+/g, '-');
    let zip = makeZip(), part = 1, n = 0;
    const parts = [];
    for(const it of list){
      n++; setDl('Adding ' + n + ' of ' + list.length + ': ' + it.name, pct());
      const f = await getFile(it, sig, (g) => setDl('Adding ' + n + ' of ' + list.length + ': ' + it.name, pct(g)));
      if(zip.size && zip.size + f.size > 2e9){ parts.push(zip.finish()); zip = makeZip(); part++; }
      await zip.add(f);
      doneBytes += +it.size || 0;
    }
    parts.push(zip.finish());
    parts.forEach((b, k) => saveBlob(b, base + (parts.length > 1 ? '-part' + (k + 1) : '') + '.zip'));
    $('dlT').textContent = 'Download started'; setDl(list.length + ' ' + label + ' in ' + (parts.length > 1 ? parts.length + ' zip files' : 'one zip file') + '. Check your Downloads folder.', 100); $('dlX').textContent = 'Close';
  }catch(e){ failDl(e); }
}

/* ---- tiny ZIP writer (stored, no compression: photos and videos are already compressed) ---- */
const CRC_T = (() => { const t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(buf){ let c = 0xFFFFFFFF; for(let i = 0; i < buf.length; i++) c = CRC_T[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(){
  const parts = [], central = []; let offset = 0;
  const enc = new TextEncoder(), used = {};
  const dosTime = d => ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = d => (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
  return {
    get size(){ return offset; },
    async add(file){
      let name = file.name, k = 1; while(used[name]){ k++; name = file.name.replace(/(\.[^.]*)?$/, m => '-' + k + m); } used[name] = 1;
      const data = new Uint8Array(await file.arrayBuffer()), crc = crc32(data), nm = enc.encode(name), now = new Date();
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, dosTime(now), true); h.setUint16(12, dosDate(now), true); h.setUint32(14, crc, true);
      h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
      parts.push(h, nm, file);   // the File itself, so the bytes are not held twice
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, dosTime(now), true); c.setUint16(14, dosDate(now), true); c.setUint32(16, crc, true);
      c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nm.length, true);
      c.setUint32(42, offset, true);
      central.push(c, nm);
      offset += 30 + nm.length + data.length;
    },
    finish(){
      const cdSize = central.reduce((a, x) => a + (x.byteLength || x.length), 0), count = central.length / 2;
      const e = new DataView(new ArrayBuffer(22));
      e.setUint32(0, 0x06054b50, true); e.setUint16(8, count, true); e.setUint16(10, count, true);
      e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
      return new Blob([...parts, ...central, e], { type:'application/zip' });
    }
  };
}

/* ===== viewer: swipe left/right with the photo following your finger, thumbnail strip underneath ===== */
let LBI=0, LBL=[];                       // LBL = the files in the tab you opened from (All / Photos / Videos)
const thumbOf=it=>it.kind==='video'?(it.poster||''):it.url;
function openLb(gi){
  LBL=visible(); LBI=Math.max(0,LBL.indexOf(ITEMS[gi]));
  $('lbStrip').innerHTML=LBL.map((it,i)=>{const t=thumbOf(it);
    return `<button class="lb-th" type="button" data-t="${i}" aria-label="Open ${esc(it.name)}">${t?`<img src="${esc(t)}" loading="lazy" decoding="async" alt="">`:''}${it.kind==='video'?'<span class="v">&#9654;</span>':''}${FAV.has(it.name)?'<span class="h">&#9829;</span>':''}</button>`;}).join('');
  paintLb(); $('lb').classList.add('on'); document.body.style.overflow='hidden';
}
function closeLb(){$('lb').classList.remove('on');$('lbMedia').innerHTML='';document.body.style.overflow='';}
function stepLb(d,swiped){
  if(LBL.length<2) return;
  const m=$('lbMedia'), w=$('lbStage').clientWidth||innerWidth;
  // slide the current file out, then the next one in from the other side
  m.classList.add('slide'); m.style.transform=`translateX(${d>0?-w:w}px)`; m.style.opacity='0';
  setTimeout(()=>{ LBI=(LBI+d+LBL.length)%LBL.length; paintLb();
    m.classList.remove('slide'); m.style.transform=`translateX(${d>0?w*.35:-w*.35}px)`;
    requestAnimationFrame(()=>{ m.classList.add('slide'); m.style.transform=''; m.style.opacity=''; });
  }, swiped?150:180);
}
function goLb(i){ if(i===LBI) return; const d=i>LBI?1:-1; LBI=i-d; stepLb(d); }
function paintLb(){
  const it=LBL[LBI]; if(!it) return;
  $('lbName').textContent=it.name;$('lbSize').textContent=fmtSize(it.size);$('lbCount').textContent=(LBI+1)+' of '+LBL.length;
  $('lbProg').style.width=((LBI+1)/LBL.length*100)+'%';
  const m=$('lbMedia');
  if(it.kind==='video'&&it.url&&playable(it.name)) m.innerHTML=`<video src="${esc(it.url)}" controls autoplay playsinline ${it.poster?`poster="${esc(it.poster)}"`:''}></video>`;
  else if(it.kind==='video') m.innerHTML=`<div class="novid">${it.poster?`<img src="${esc(it.poster)}" alt="" style="max-height:60vh;border-radius:8px;margin:0 auto 16px">`:''}<p>Preview isn't available for this format in the browser.<br>Use <b>Download</b> to save the full-quality video.</p></div>`;
  else if(it.kind==='image'&&it.url) m.innerHTML=`<img src="${esc(it.url)}" alt="${esc(it.name)}" draggable="false">`;
  else m.innerHTML=`<div class="novid"><p>No preview. Use <b>Download</b> to save this file.</p></div>`;
  $('lbDl').onclick=()=>download(it);
  paintLbFav();
  // highlight the thumbnail and keep it centred in the strip
  const st=$('lbStrip'), on=st.querySelector('.lb-th.on'); if(on) on.classList.remove('on');
  const th=st.querySelector(`[data-t="${LBI}"]`); if(th){ th.classList.add('on'); st.scrollTo({left:th.offsetLeft-st.clientWidth/2+th.offsetWidth/2}); }
  // load the next and previous photos early so swiping feels instant
  [1,-1].forEach(d=>{ const n=LBL[(LBI+d+LBL.length)%LBL.length]; if(n&&n.kind==='image'&&n.url){ const im=new Image(); im.src=n.url; } });
}
$('lbStrip').addEventListener('click',e=>{const b=e.target.closest('[data-t]'); if(b) goLb(+b.dataset.t);});
$('lbFav').onclick=()=>toggleFav(LBL[LBI],$('lbFav'));
$('lbClose').onclick=closeLb;$('lbPrev').onclick=()=>stepLb(-1);$('lbNext').onclick=()=>stepLb(1);
$('lbStage').addEventListener('click',e=>{if(e.target.id==='lbStage'||e.target.id==='lbMedia')closeLb();});
/* swipe: the photo follows your finger; let go past a third of the screen (or flick) for the next one; pull down to close */
(function(){ const st=$('lbStage'), m=$('lbMedia'); let x0=0,y0=0,t0=0,on=false,axis='';
  st.addEventListener('touchstart',e=>{ if(e.touches.length!==1||e.target.closest('video,.lb-nav'))return; on=true; axis=''; x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); m.classList.remove('slide'); },{passive:true});
  st.addEventListener('touchmove',e=>{ if(!on)return; const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    if(!axis && (Math.abs(dx)>8||Math.abs(dy)>8)) axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
    if(axis==='x'){ const edge=(LBL.length<2)?.25:1; m.style.transform=`translateX(${dx*edge}px)`; m.style.opacity=String(1-Math.min(.5,Math.abs(dx)/900)); }
    else if(axis==='y'&&dy>0){ m.style.transform=`translateY(${dy}px)`; $('lb').style.background='rgba(18,19,22,'+Math.max(.4,.97-dy/600)+')'; } },{passive:true});
  st.addEventListener('touchend',e=>{ if(!on)return; on=false; const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0, w=st.clientWidth||innerWidth, fast=Date.now()-t0<300;
    $('lb').style.background='';
    if(axis==='x' && LBL.length>1 && (Math.abs(dx)>w/3 || (fast&&Math.abs(dx)>50))) return stepLb(dx<0?1:-1,true);
    if(axis==='y' && dy>110) return closeLb();
    m.classList.add('slide'); m.style.transform=''; m.style.opacity='';
    // double tap the photo to add it to favourites (like Instagram)
    if(!axis && !e.target.closest('video,button')){ const now=Date.now(); if(now-(st._tap||0)<300){ st._tap=0; const it=LBL[LBI]; if(it&&!FAV.has(it.name)) toggleFav(it,$('lbFav'));
        const h=document.createElement('div'); h.className='big-heart'; h.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 2.9 5 6.4 5c2.1 0 3.6 1.2 4.6 2.6C12 6.2 13.5 5 15.6 5 19.1 5 21 8.6 19.6 11.8 17.5 16.4 12 21 12 21z"/></svg>'; st.appendChild(h); setTimeout(()=>h.remove(),750); } else st._tap=now; } });
})();
addEventListener('keydown',e=>{if(!$('lb').classList.contains('on'))return;if(e.key==='Escape')closeLb();else if(e.key==='ArrowRight')stepLb(1);else if(e.key==='ArrowLeft')stepLb(-1);else if(e.key==='f'||e.key==='F')toggleFav(LBL[LBI],$('lbFav'));});

function stateBox(mascot,h,p){$('app').innerHTML=`<div class="state"><div class="box">${mascot?`<img class="mascot" src="${esc(CONFIG.mascot)}" alt="" onerror="this.style.display='none'">`:''}<h3>${h}</h3><p>${p}</p><p style="margin-top:18px"><a class="btn ghost" href="client-portal.html">Back to portal</a></p></div></div>`;}

      }catch(e){ console.warn('favourites load', e); FOM_FAV.status('', ''); }
