<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>FOM Studios | Your Gallery</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="FOM Studios">
<meta property="og:title" content="Your gallery | FOM Studios">
<meta property="og:description" content="View, favourite and download your FOM Studios photos and videos.">
<meta property="og:image" content="https://www.fomstudios.co.za/assets/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* ===== FOM theme (cream, navy accent) ===== */
:root{
  --bg:#f1f0ec; --panel:#fafaf9; --panel-2:#eeece6; --line:#dcdad3;
  --ink:#2a2b2c; --ink-soft:#6f6f6d; --ink-dim:#9a9895;
  --accent:#02367B; --accent-2:#5B9AE0; --on-accent:#ffffff;
  --radius:18px; --radius-sm:12px; --gutter:clamp(18px,5vw,56px);
  --container:1280px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{max-width:100%;overflow-x:hidden;}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
img,video{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;}
.wrap{max-width:var(--container);margin:0 auto;padding:0 var(--gutter);}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700;}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:700;font-size:13.5px;
  background:var(--accent);color:var(--on-accent);transition:transform .12s,opacity .2s;white-space:nowrap;}
.btn:active{transform:scale(.97);} .btn:hover{opacity:.92;}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
.btn.ghost:hover{border-color:var(--ink);}
.btn svg{width:17px;height:17px;} .btn.sm{height:38px;padding:0 15px;font-size:12.5px;}

/* ===== top bar ===== */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px var(--gutter);background:rgba(250,250,249,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.topbar .mark{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.1em;font-size:14px;text-transform:uppercase;color:var(--ink);}
.topbar .mark img{width:36px;height:36px;border-radius:50%;object-fit:contain;padding:3px;background:#fff;box-shadow:0 0 0 1px var(--line);}

/* ===== hero (image band with light fade into the page) ===== */
.hero{position:relative;min-height:clamp(380px,62vh,600px);display:flex;align-items:flex-end;overflow:hidden;background:#15161a;}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;}
.hero .bg{filter:brightness(.72) saturate(.9);transition:opacity .5s ease;}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,15,18,.72) 0%,rgba(14,15,18,.45) 45%,rgba(14,15,18,.12) 100%),linear-gradient(180deg,rgba(14,15,18,.35) 0%,rgba(14,15,18,.3) 35%,rgba(14,15,18,.8) 84%,var(--bg) 100%);}
@media(max-width:640px){.hero .scrim{background:linear-gradient(180deg,rgba(14,15,18,.5) 0%,rgba(14,15,18,.55) 35%,rgba(14,15,18,.85) 84%,var(--bg) 100%);}}
.hero .inner{position:relative;z-index:2;width:100%;padding:0 var(--gutter) clamp(26px,5vw,52px);max-width:var(--container);margin:0 auto;}
.hero .eyebrow{color:#bcd4f5;}
.hero h1{font-size:clamp(38px,9vw,84px);font-weight:800;line-height:.98;letter-spacing:-.02em;text-transform:uppercase;color:#fff;margin:10px 0 0;text-shadow:0 2px 24px rgba(0,0,0,.5);}
.hero h1 .accent{color:#8fb8e8;display:block;}
.hero .sub{color:rgba(255,255,255,.94);font-size:clamp(14px,2.4vw,16px);margin-top:14px;max-width:44ch;text-shadow:0 1px 12px rgba(0,0,0,.55);}
.hero .rule{height:1px;background:rgba(255,255,255,.25);margin:22px 0 16px;max-width:520px;}
.meta{display:flex;flex-wrap:wrap;gap:clamp(20px,6vw,54px);}
.meta .m .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:700;}
.meta .m .v{font-size:16px;font-weight:800;margin-top:4px;letter-spacing:.02em;color:#fff;}
.meta .m .v.hi{color:#8fb8e8;}
.meta .m .v.exp{color:#ffb4ae;}
.meta .m .v small{display:block;font-size:11.5px;font-weight:600;letter-spacing:.03em;color:#ffb4ae;opacity:.85;margin-top:2px;}
.topbar .tb-r{display:flex;align-items:center;gap:8px;}
.topbar .back{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;}
.topbar .back:hover{border-color:var(--ink);}

/* ===== library toolbar ===== */
.lib{padding-top:clamp(28px,6vw,52px);}
.lib-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
.lib-head h2{font-size:clamp(26px,5vw,44px);font-weight:800;letter-spacing:-.01em;text-transform:uppercase;margin-top:8px;}
.lib-head .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;}
.tab{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;height:38px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-soft);border:1px solid var(--line);background:var(--panel);transition:.15s;}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.tab .n{opacity:.6;margin-left:6px;}

/* ===== grid ===== */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:4px;}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}}
@media(min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;}}
.more{display:flex;flex-direction:column;align-items:center;gap:12px;margin:26px 0 4px;color:var(--ink-soft);font-size:13px;}
.more .mb{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.more .rv{font-size:13px;color:var(--ink-soft);}
.more .rv a{color:var(--accent);font-weight:700;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .2s;}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -16px rgba(0,0,0,.35);}
.card .thumb{position:relative;aspect-ratio:1/1;background:var(--panel-2);overflow:hidden;}
.card .thumb img,.card .thumb video{width:100%;height:100%;object-fit:cover;}
.card .thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-dim);font-size:34px;}
/* video stills: a frame from about half a second in, loaded only when the card scrolls into view */
video.vstill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;opacity:0;transition:opacity .35s;}
video.vstill.ready{opacity:1;}
.badge{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;
  background:rgba(20,21,24,.72);backdrop-filter:blur(6px);font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;}
.badge svg{width:12px;height:12px;}
.dl-mini{position:absolute;top:7px;right:7px;width:34px;height:34px;border-radius:50%;background:rgba(20,21,24,.72);backdrop-filter:blur(6px);
  display:grid;place-items:center;color:#fff;transition:background .2s;}
.dl-mini:hover{background:var(--accent);}
/* download progress sheet */
.dl-scrim{position:fixed;inset:0;z-index:300;background:rgba(10,10,12,.55);display:none;align-items:flex-end;justify-content:center;}
.dl-scrim.on{display:flex;}
.gq label{display:block;font-size:13px;font-weight:700;margin:12px 0 0;} .gq label small{font-weight:400;color:var(--ink-soft);}
.gq input{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg,#fff);color:var(--ink);font:inherit;font-size:16px;}
.gq input:focus{outline:none;border-color:var(--accent);}
.dl-box{background:var(--panel);color:var(--ink);width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:22px 20px calc(18px + var(--safe-b));box-shadow:0 -10px 40px rgba(0,0,0,.25);}
@media(min-width:600px){.dl-scrim{align-items:center;}.dl-box{border-radius:22px;}}
.dl-h{font-size:18px;font-weight:800;}
.dl-sub{font-size:13.5px;color:var(--ink-soft);margin:6px 0 12px;min-height:18px;word-break:break-word;}
.dl-bar{height:8px;border-radius:9px;background:var(--panel-2);overflow:hidden;}
.dl-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width .2s;}
.dl-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;} .dl-acts .btn{flex:1 1 30%;min-width:96px;justify-content:center;} .dl-acts .btn[hidden]{display:none;}
.dl-note{font-size:12.5px;color:var(--ink-soft);margin-top:10px;line-height:1.5;} .dl-note a{color:var(--accent);font-weight:700;}
button.btn{cursor:pointer;}
/* favourites */
.fav{position:absolute;right:7px;bottom:7px;width:36px;height:36px;border-radius:50%;background:rgba(20,21,24,.6);backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff;transition:transform .15s,background .2s;z-index:2;}
.fav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;}
.fav.on{background:#fff;color:#e0245e;}
.fav.on svg{fill:currentColor;}
.fav.pop{animation:favpop .3s ease;}
@keyframes favpop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.lb-fav{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;}
.lb-fav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;}
.lb-fav.on{background:#fff;color:#e0245e;} .lb-fav.on svg{fill:currentColor;}
.lb-th .h{position:absolute;right:3px;top:2px;color:#ff4d7d;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6);}
.fav-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:0 0 14px;font-size:13.5px;color:var(--ink-soft);}
.fav-bar b{color:var(--ink);} .fav-bar .heart{color:#e0245e;}
.fav-bar .st{margin-left:auto;font-size:12.5px;}
.fav-bar .st.ok{color:#1f8a4c;} .fav-bar .st.warn{color:#b0640b;}
.fav-empty{grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:40px 10px;font-size:14px;line-height:1.7;}
@keyframes favpop2{0%{transform:scale(.6);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:0}}
.big-heart{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;color:#fff;pointer-events:none;animation:favpop2 .7s ease forwards;filter:drop-shadow(0 4px 14px rgba(0,0,0,.4));}
.dl-mini svg{width:16px;height:16px;}
.play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;}
.play span{width:54px;height:54px;border-radius:50%;background:rgba(20,21,24,.5);backdrop-filter:blur(4px);display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.6);}
.play span svg{width:20px;height:20px;margin-left:3px;fill:#fff;}
.card .cap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;}
.card .cap .nm{font-size:12.5px;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .cap .sz{font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap;}

/* ===== thank you / footer ===== */
.thanks{margin-top:clamp(40px,8vw,84px);border-top:1px solid var(--line);padding:clamp(40px,7vw,70px) 0 0;text-align:center;}
.thanks .mascot{width:84px;height:84px;border-radius:50%;object-fit:contain;padding:8px;background:#fff;box-shadow:0 10px 26px -10px rgba(0,0,0,.35);margin:0 auto 20px;display:block;}
.thanks .big{font-size:clamp(30px,6vw,50px);font-weight:800;text-transform:uppercase;letter-spacing:-.01em;}
.thanks p{color:var(--ink-soft);max-width:52ch;margin:16px auto 0;font-size:15px;line-height:1.7;}
.thanks .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px;}
.foot{margin-top:clamp(44px,8vw,78px);padding:26px var(--gutter) calc(30px + var(--safe-b));border-top:1px solid var(--line);text-align:center;color:var(--ink-dim);font-size:12.5px;}
.foot .fb{font-weight:800;letter-spacing:.12em;color:var(--ink);text-transform:uppercase;margin-bottom:6px;}
.foot a{color:var(--accent);font-weight:600;}

/* ===== states ===== */
.gp-bar{display:none;background:var(--panel);border:1.5px solid var(--accent);border-radius:16px;padding:14px 16px;margin:0 0 14px;gap:10px;flex-wrap:wrap;align-items:center;}
.gp-bar.on{display:flex;}
.gp-bar .tx{flex:1;min-width:220px;font-size:14px;line-height:1.45;}
.gp-bar .tx b{display:block;font-size:15px;margin-bottom:2px;}
.gp-bar .st{display:block;font-size:12.5px;color:var(--soft,#666);margin-top:4px;}
.gp-bar .st.ok{color:#1f8a4c;} .gp-bar .st.warn{color:#b3261e;}
.gp-bar .bt{display:flex;gap:6px;flex-wrap:wrap;}
.gp-tick{position:absolute;bottom:8px;left:8px;z-index:3;width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);color:#fff;font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.gp-tick.on{background:var(--accent);}
.gp-mode .card .thumb{cursor:pointer;}
.gp-mode .gp-bar{position:sticky;top:72px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.12);}
.gp-mode .card:not(.gp-in) img{opacity:.45;}
.gp-badge{position:absolute;bottom:8px;left:8px;z-index:2;background:var(--accent);color:#fff;border-radius:99px;font-size:11px;font-weight:800;padding:3px 8px;}
.gview .dl-mini,.gview [data-dlall],.gview #lbDl,.gview .sel-btn{display:none!important;}
.dl-pair{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.sel-bar{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(720px,calc(100% - 24px));box-sizing:border-box;z-index:45;background:var(--panel);border:1.5px solid var(--accent);border-radius:18px;padding:12px 14px;margin:0;gap:10px;flex-wrap:wrap;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.12);}
.sel-bar.on{display:flex;}
.sel-bar .tx{flex:1;min-width:150px;font-size:13px;line-height:1.4;color:var(--soft,#666);}
.sel-bar .tx b{display:block;font-size:15.5px;color:var(--ink,inherit);}
.sel-bar .bt{display:flex;gap:6px;flex-wrap:wrap;}
.sel-bar .btn[disabled]{opacity:.45;pointer-events:none;}
.sel-tick{position:absolute;top:8px;left:8px;z-index:3;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.3);color:#fff;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);padding:0;}
.sel-tick.on{background:var(--accent);}
.sel-mode .card .thumb{cursor:pointer;}
.sel-mode .card .dl-mini,.sel-mode .card .badge{display:none;}
.sel-mode .card.sel-in .thumb{outline:3px solid var(--accent);outline-offset:-3px;}
.sel-mode .card.sel-in img{transform:scale(.94);transition:transform .15s;}
body.sel-mode{padding-bottom:150px;}
@media(max-width:560px){.sel-bar .tx{min-width:100%;}.sel-bar .bt{width:100%;}.sel-bar .bt .btn{flex:1;justify-content:center;}}
.pin{display:flex;gap:10px;justify-content:center;margin:18px 0 6px;}
.pin input{width:200px;text-align:center;font-size:28px;letter-spacing:.4em;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);font-weight:800;}
.pin-err{color:#b3261e;font-size:13.5px;min-height:1.2em;}
.grp-cta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px;}
.state{min-height:62vh;display:grid;place-items:center;text-align:center;padding:40px var(--gutter);}
.state .box{max-width:440px;} .state .box .mascot{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#fff;margin:0 auto 16px;display:block;box-shadow:0 8px 22px -10px rgba(0,0,0,.4);}
.state h3{font-size:22px;font-weight:800;margin-bottom:8px;} .state p{color:var(--ink-soft);font-size:14.5px;line-height:1.7;}
.hidden{display:none!important;}

/* ===== lightbox (dark media viewer) ===== */
.lb{position:fixed;inset:0;z-index:200;background:#121316;display:none;flex-direction:column;}
.lb.on{display:flex;}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px var(--gutter);color:#fff;}
.lb-top .info .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw;}
.lb-top .info .sz{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px;}
.lb-top .acts{display:flex;gap:10px;align-items:center;flex:none;}
.lb-top .info{flex:1;min-width:0;}
.lb-top .info .nm{max-width:100%;}
@media(max-width:560px){.lb-top{gap:8px;padding:12px 12px;}.lb-top .acts{gap:6px;}.lb-top .acts .btn.sm{padding:0 12px;}.lb-top .acts .lbl{display:none;}.lb-top .acts .btn.sm svg{margin:0;}.lb-x{width:38px;height:38px;}.tab{height:36px;padding:0 13px;}}
.lb-x{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;font-size:22px;line-height:1;}
.lb-stage{flex:1;position:relative;display:grid;place-items:center;padding:0 clamp(8px,4vw,64px);min-height:0;}
.lb-stage img{max-width:100%;max-height:calc(100dvh - 190px);object-fit:contain;border-radius:8px;}
.lb-stage video{max-width:100%;max-height:calc(100dvh - 190px);border-radius:8px;background:#000;}
.lb-stage .novid{text-align:center;color:rgba(255,255,255,.75);}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;font-size:24px;}
.lb-nav:hover{background:var(--accent);}
.lb-prev{left:10px;}.lb-next{right:10px;}
.lb-count{text-align:center;padding:10px 14px 6px;color:rgba(255,255,255,.7);font-size:12.5px;letter-spacing:.1em;}
.lb-stage{overflow:hidden;touch-action:pan-y;}
#lbMedia{display:grid;place-items:center;will-change:transform;}
#lbMedia.slide{transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .26s;}
/* progress + thumbnail strip */
.lb-prog{height:3px;background:rgba(255,255,255,.14);margin:0 var(--gutter);border-radius:9px;overflow:hidden;}
.lb-prog i{display:block;height:100%;width:0;background:var(--accent-2,#5B9AE0);border-radius:9px;transition:width .25s;}
.lb-strip{display:flex;gap:6px;overflow-x:auto;padding:10px var(--gutter) calc(14px + var(--safe-b));scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.lb-strip::-webkit-scrollbar{display:none;}
.lb-th{flex:none;width:54px;height:54px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.08);border:0;padding:0;opacity:.45;transition:opacity .2s,transform .2s,outline-color .2s;outline:2px solid transparent;outline-offset:-2px;position:relative;cursor:pointer;}
.lb-th img{width:100%;height:100%;object-fit:cover;}
.lb-th .v{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:16px;z-index:1;text-shadow:0 1px 4px rgba(0,0,0,.6);}
.lb-th.on{opacity:1;outline-color:#fff;transform:scale(1.06);}
.lb-th:hover{opacity:.85;}
@media(min-width:900px){.lb-th{width:66px;height:66px;}}

@media(max-width:640px){.lb-nav{width:40px;height:40px;font-size:20px;}}

<body>

<div id="app"></div>

<!-- LIGHTBOX -->
<div class="lb" id="lb" role="dialog" aria-modal="true">
  <div class="lb-top">
    <div class="info"><div class="nm" id="lbName"></div><div class="sz" id="lbSize"></div></div>
    <div class="acts">
      <button class="lb-fav" id="lbFav" type="button" aria-label="Add to favourites"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 2.9 5 6.4 5c2.1 0 3.6 1.2 4.6 2.6C12 6.2 13.5 5 15.6 5 19.1 5 21 8.6 19.6 11.8 17.5 16.4 12 21 12 21z"/></svg></button>
      <button class="btn sm" id="lbPrint" type="button" hidden aria-label="Order a print">🖼<span class="lbl"> Print</span></button>
      <button class="btn sm" id="lbDl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg><span class="lbl">Download</span></button>
      <button class="lb-x" id="lbClose" aria-label="Close">&times;</button>
    </div>
  </div>
  <div class="lb-stage" id="lbStage">
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">&#8249;</button>
    <div id="lbMedia"></div>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Next">&#8250;</button>
  </div>
  <div class="lb-count" id="lbCount"></div>
  <div class="lb-prog" aria-hidden="true"><i id="lbProg"></i></div>
  <div class="lb-strip" id="lbStrip" aria-label="All files"></div>
</div>

<script>
/* ============================================================
   FOM STUDIOS, Client gallery (reads file list from the R2 Worker).
   Opens in DEMO mode (sample tiles) when no Worker/params are set.
   ============================================================ */
const CONFIG = {
  worker:      'https://fom-gallery.cold-moon-d65c.workers.dev', // blank = demo mode
  banner:      'assets/email-hero.jpg',                       // fixed FOM hero banner (swap for your branded image)
  mascot:      'assets/mascot-head-color.jpg',
  reviewUrl:   'feedback.html',                               // your own feedback form (or an external http(s) link)
  reviewLabel: 'Leave a review',
  feedbackUrl: '',                                            // optional second button (e.g. a Google Form)
  feedbackLabel:'Share feedback',
  site:'www.fomstudios.co.za', email:'info@fomstudios.co.za', phone:'068 690 1120',
  instagram:'https://instagram.com/fom_studios_'
};

/* Shot by A: her details and a plain branded hero until she has her own banner photo */
if(window.FOM_CLIENT && FOM_CLIENT.id === 'sba') Object.assign(CONFIG, { banner:'', mascot:'shotbya/logo.png', site:FOM_CLIENT.site, email:FOM_CLIENT.email, instagram:'https://instagram.com/' + FOM_CLIENT.instagram, reviewUrl:'feedback.html' });
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const GAL = {
  folder: P.get('g') || '',
  name:   P.get('name') || 'there',
  date:   P.get('date') || '',
  expiry: P.get('expiry') || '',
  dl:     P.get('dl') || '',
  order:  P.get('o') || '',       // the booking, so favourites can be sent to FOM Studios
  group:  (P.get('s') || '').replace(/[^a-z0-9]/g, '').slice(0, 12),   // a group link (everyone at an event), made on the Database page
  mode:   'free', k:'', title:'', expires:''
};
if(GAL.group){ GAL.folder = ''; GAL.order = ''; GAL.dl = ''; }

/* ---- header photo: the client's own cover (set on the Database, passed in the link as cover/fx/fy),
   else the business header from the dashboard Website page (siteContent site / site_sba, galleryHeader),
   else the built-in default. Fades in so clients never see the wrong picture flash first. ---- */
const SBA_G = !!(window.FOM_CLIENT && FOM_CLIENT.id === 'sba');
const HDR_KEY = 'fom.gh.' + (SBA_G ? 'sba' : 'fom');
const pct = (v, d) => { const n = parseFloat(v); return isFinite(n) ? Math.max(0, Math.min(100, Math.round(n))) : d; };
const HDR = { url:CONFIG.banner || '', fx:50, fy:50, line:'', ready:false };
let GHOLD = !!GAL.group, GCOVER = null;   // group links wait for their own header (the client's, from the Database) before showing one
const ghUrl = src => !src ? '' : String(src).indexOf('r2:') === 0 ? CONFIG.worker + '/file?g=portfolio%2F&n=' + encodeURIComponent(String(src).slice(3)) : src;
function setBizHeader(g){
  if(!g) return;
  if(g.line) HDR.line = String(g.line).slice(0, 60);
  if(P.get('cover') || GCOVER) return;             // the client's own cover wins
  if(g.src){ HDR.url = ghUrl(g.src); HDR.fx = pct(g.fx, 50); HDR.fy = pct(g.fy, 50); }
}
if(P.get('cover') && GAL.folder && CONFIG.worker){
  Object.assign(HDR, { url:CONFIG.worker + '/file?g=' + encodeURIComponent(GAL.folder) + '&n=' + encodeURIComponent(P.get('cover')), fx:pct(P.get('fx'), 50), fy:pct(P.get('fy'), 40), ready:true });
}
try{ const c = JSON.parse(localStorage.getItem(HDR_KEY)); if(c){ setBizHeader(c); HDR.ready = true; } }catch(e){}
function applyHeader(){
  const bg = document.querySelector('.hero .bg');
  if(bg && GHOLD) bg.style.opacity = 0;
  else if(bg){ bg.style.backgroundImage = HDR.url ? 'url("' + HDR.url.replace(/"/g, '%22') + '")' : 'none'; bg.style.backgroundPosition = HDR.fx + '% ' + HDR.fy + '%'; if(HDR.ready) bg.style.opacity = 1; }
  const eb = document.querySelector('.hero .eyebrow'); if(eb && HDR.line) eb.textContent = HDR.line;
}
(function loadBizHeader(){
  const fv = v => !v ? null : ('stringValue' in v) ? v.stringValue : ('integerValue' in v) ? +v.integerValue : ('doubleValue' in v) ? +v.doubleValue : null;
  const done = () => { HDR.ready = true; applyHeader(); };
  const t = setTimeout(done, 2500);
  fetch('https://firestore.googleapis.com/v1/projects/fom-studios/databases/(default)/documents/siteContent/' + (SBA_G ? 'site_sba' : 'site') + '?key=AIzaSyCbRXQmIxzVWuFS0CRmDY33qYuzpcVL80A')
    .then(r => r.ok ? r.json() : null).then(j => {
      const f = j && j.fields && j.fields.galleryHeader && j.fields.galleryHeader.mapValue && j.fields.galleryHeader.mapValue.fields;
      const g = f ? { src:fv(f.src) || '', fx:fv(f.fx), fy:fv(f.fy), line:fv(f.line) || '' } : { src:'', line:'' };
      try{ localStorage.setItem(HDR_KEY, JSON.stringify(g)); }catch(e){}
      if(!g.src && !P.get('cover') && !GCOVER) HDR.url = CONFIG.banner || '';
      setBizHeader(g);
    }).catch(() => {}).then(() => { clearTimeout(t); done(); });
})();

const VIDEO_EXT=['mp4','webm','m4v','ogg','mov','avi','mkv'], PLAYABLE=['mp4','webm','m4v','ogg','mov'], IMAGE_EXT=['jpg','jpeg','png','webp','gif','avif','bmp'];
const ext=n=>(n.split('.').pop()||'').toLowerCase();
const kindOf=n=>VIDEO_EXT.includes(ext(n))?'video':IMAGE_EXT.includes(ext(n))?'image':'file';
const playable=n=>PLAYABLE.includes(ext(n));
function fmtSize(b){b=+b||0;if(b>=1e9)return(b/1e9).toFixed(2)+' GB';if(b>=1e6)return(b/1e6).toFixed(1)+' MB';if(b>=1e3)return(b/1e3).toFixed(0)+' KB';return b+' B';}
function niceDate(s){if(!s)return'';try{const d=new Date(s.length<=10?s+'T00:00:00':s);return d.toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'});}catch(e){return s;}}
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

let ITEMS=[], FILTER='all';
const GROUP_WA = SBA_G ? '' : 'https://chat.whatsapp.com/EwI9Zg2tjfhGX8gISj1TpA';

function demoItems(){const A=n=>'assets/'+n;return[
  {name:'FOM_Hero_01.jpg',size:9400000,kind:'image',url:A('email-hero.png')},
  {name:'FOM_0421.jpg',size:6200000,kind:'image',url:A('mascot-head-color.jpg')},
  {name:'FOM_0422.jpg',size:5800000,kind:'image',url:A('mascot-head-gold.jpg')},
  {name:'FOM_0423.jpg',size:5100000,kind:'image',url:A('mascot-head-silver.jpg')},
  {name:'FOM_0424.jpg',size:4700000,kind:'image',url:A('mascot-head-bronze.jpg')},
  {name:'Detail_logo.jpg',size:3300000,kind:'image',url:A('logo.png')},
  {name:'Behind_scenes.jpg',size:4200000,kind:'image',url:A('mascot.png')},
  {name:'Highlight_Reel.mp4',size:88000000,kind:'video',url:'',poster:A('email-hero.png')}
];}

/* ===== group link: everyone at an event opens the same gallery (no portal, no folder in the link) ===== */
const GV = (()=>{ try{ let v = localStorage.getItem('fom.gv'); if(!v){ v = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); localStorage.setItem('fom.gv', v); } return v; }catch(e){ return ''; } })();
async function groupOpen(pin){
  const r = await fetch(CONFIG.worker + '/group/open', { method:'POST', headers:{ 'Content-Type':'text/plain' }, body:JSON.stringify({ s:GAL.group, pin:pin || '', v:GV }) });
  const j = await r.json().catch(() => ({}));
  if(j.ended || r.status === 410) return groupEnded(j);
  if(j.soon) return stateBox(1, 'Photos coming soon', 'The photos from ' + esc(j.title || 'the day') + ' are being chosen. Check back soon, the link stays the same.');
  if(j.mode === 'paid'){ if(j.salesUrl) location.replace(j.salesUrl); else stateBox(1, 'Photos coming soon', 'These photos are being prepared. Check back soon.'); return; }
  if(!r.ok){ if(r.status === 403 || r.status === 429) return pinBox(j.error); return renderError(); }
  try{ if(pin) sessionStorage.setItem('fom.gpin.' + GAL.group, pin); }catch(e){}
  Object.assign(GAL, { mode:j.mode, k:j.k, title:j.title, name:j.title, date:j.date || '', expiry:j.expires || '' });
  if(GAL.mode === 'view') document.body.classList.add('gview');
  ITEMS = (j.files || []).map(f => ({ name:f.name, size:f.size, url:f.url, th:f.th, web:f.web, kind:f.kind || kindOf(f.name) }));
  if(!ITEMS.length) return stateBox(1, 'No photos here yet', 'Check back soon.');
  document.title = GAL.title + ' | ' + (SBA_G ? 'Shot by A' : 'FOM Studios');
  renderGallery();
}
function groupEnded(j){ stateBox(1, 'This gallery has ended', (j && j.title ? esc(j.title) + ' was shared for a limited time. ' : '') + 'Ask ' + (SBA_G ? 'Shot by A' : 'FOM Studios') + ' if you still need a photo.'); }
function pinBox(err){
  $('app').innerHTML = `<div class="state"><div class="box"><img class="mascot" src="${esc(CONFIG.mascot)}" alt="" onerror="this.style.display='none'"><h3>${esc(GAL.title || 'Event photos')}</h3><p>Type the 4-digit PIN you got with the link.</p>
    <form class="pin" id="pinF"><input id="pinI" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" aria-label="PIN"></form><div class="pin-err">${esc(err || '')}</div>
    <p style="margin-top:14px"><button class="btn" type="button" id="pinGo">Open the photos</button></p></div></div>`;
  const i = $('pinI'), go = () => { const v = i.value.replace(/\D/g, ''); if(v.length === 4) groupOpen(v); };
  i.focus(); i.addEventListener('input', () => { if(i.value.replace(/\D/g, '').length === 4) go(); });
  $('pinF').onsubmit = e => { e.preventDefault(); go(); }; $('pinGo').onclick = go;
}
async function groupLoad(){
  try{
    const r = await fetch(CONFIG.worker + '/group/info?s=' + GAL.group), j = await r.json();
    if(!r.ok) return stateBox(1, 'Link not found', 'Please check the link you were sent.');
    GAL.title = j.title;
    if(j.cover){ GCOVER = j.cover; Object.assign(HDR, { url:CONFIG.worker + '/group/cover?s=' + GAL.group, fx:pct(j.cover.fx, 50), fy:pct(j.cover.fy, 40) }); }
    GHOLD = false; HDR.ready = true; applyHeader();
    if(j.ended) return groupEnded(j);
    if(j.soon) return stateBox(1, 'Photos coming soon', 'The photos from ' + esc(j.title) + ' are being chosen. Check back soon, the link stays the same.');
    if(j.mode === 'paid'){ if(j.salesUrl) location.replace(j.salesUrl); else stateBox(1, 'Photos coming soon', 'These photos are being prepared. Check back soon.'); return; }
    let pin = ''; try{ pin = sessionStorage.getItem('fom.gpin.' + GAL.group) || ''; }catch(e){}
    if(j.needPin && !pin) return pinBox('');
    groupOpen(pin);
  }catch(e){ GHOLD = false; renderError(); }
}

async function load(){
  if(GAL.group) return groupLoad();
  if(GAL.expiry){const exp=new Date(GAL.expiry+'T23:59:59');if(new Date()>exp)return renderExpired();}
  if(CONFIG.worker && GAL.folder){
    try{
      const r=await fetch(CONFIG.worker.replace(/\/$/,'')+'/list?g='+encodeURIComponent(GAL.folder));
      if(!r.ok)throw 0;
      const data=await r.json();
      ITEMS=(data.files||data||[]).map(f=>({name:f.name,size:f.size,url:f.url,th:f.th,web:f.web,poster:f.poster,kind:f.kind||kindOf(f.name)}))
        .filter(f=>f.kind==='image'||f.kind==='video');   // only show photos/videos, never contracts, invoices or zips in the same folder
      if(!ITEMS.length)return renderEmpty();
    }catch(e){return renderError();}
  } else { ITEMS=demoItems(); }
  renderGallery();
}

function meta(){const photos=ITEMS.filter(i=>i.kind==='image').length,vids=ITEMS.filter(i=>i.kind==='video').length,total=ITEMS.reduce((a,i)=>a+(+i.size||0),0);return{photos,vids,count:ITEMS.length,total};}

function reviewHref(){ var u=CONFIG.reviewUrl; if(/^https?:/.test(u)) return u;
  return u+(u.indexOf('?')>=0?'&':'?')+'name='+encodeURIComponent(GAL.name)+'&order='+encodeURIComponent(GAL.folder)+(GAL.order?'&o='+encodeURIComponent(GAL.order):'')+(window.FOM_PREVIEW?'&preview=1':''); }
/* ===== Select: tick the photos and videos you want, then download just those ===== */
const SEL={ on:false, set:new Set() };
function selBtn(){ return `<button class="btn ghost sm sel-btn" type="button" data-sela="start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12.5l2.8 2.8L16.5 9.5"/></svg>Select</button>`; }
function selDraw(){
  const b=$('selBar'); if(!b) return; b.classList.toggle('on',SEL.on); if(!SEL.on) return;
  const n=SEL.set.size, vis=visible().filter(i=>i.url).length, size=ITEMS.filter(i=>SEL.set.has(i.name)).reduce((a,i)=>a+(+i.size||0),0);
  let rd=0, pre=0; SEL.set.forEach(nm=>{ const e=PRE.get(nm); if(e){ pre++; if(e.done) rd++; } });
  const prep=n?(rd>=n?' · all ready':pre?' · '+rd+' of '+n+' ready':''):'';
  b.innerHTML=`<div class="tx"><b>${n?n+' selected':'Tap the ones you want'}</b>${n?fmtSize(size)+prep:'Then download just those'}</div>
    <div class="bt"><button class="btn ghost sm" type="button" data-sela="${n&&n>=vis?'none':'all'}">${n&&n>=vis?'Clear':'Select all'}</button>
    <button class="btn sm" type="button" data-sela="dl"${n?'':' disabled'}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>Download${n?' '+n:''}</button>
    <button class="btn ghost sm" type="button" data-sela="done" aria-label="Done selecting">Done</button></div>`;
}
function selToggle(it){
  if(!it||!it.url) return; if(SEL.set.has(it.name)){ SEL.set.delete(it.name); preStop(it.name); } else { SEL.set.add(it.name); preStart(it); }
  const gi=ITEMS.indexOf(it), on=SEL.set.has(it.name);
  document.querySelectorAll(`.card[data-i="${gi}"]`).forEach(c=>{ c.classList.toggle('sel-in',on); const t=c.querySelector('.sel-tick'); if(t){ t.classList.toggle('on',on); t.innerHTML=on?'&#10003;':''; t.setAttribute('aria-pressed',on); } });
  selDraw();
}
/* a big selection on iPhone that did not finish: offer to carry on next visit */
function resDraw(){
  const b=$('selRes'); if(!b) return; let r=null;
  if(USE_SHARE){ try{ r=JSON.parse(localStorage.getItem(dlKey(true))||'null'); }catch(e){} }
  const pick=r&&Array.isArray(r.pick)?ITEMS.filter(i=>i.url&&r.pick.includes(i.name)):[], done=new Set(r&&r.names||[]), left=pick.filter(i=>!done.has(i.name)).length;
  if(!pick.length||!left){ b.classList.remove('on'); b.innerHTML=''; return; }
  b.classList.add('on');
  b.innerHTML=`<div class="tx"><b>Carry on saving your selection</b>${pick.length-left} of the ${pick.length} you picked are saved on this phone. ${left} still to save.</div><div class="bt"><button class="btn sm" type="button" data-res="go">Carry on (${left} left)</button><button class="btn ghost sm" type="button" data-res="no">Forget it</button></div>`;
  b.onclick=e=>{ const x=e.target.closest('[data-res]'); if(!x) return;
    if(x.dataset.res==='no'){ try{ localStorage.removeItem(dlKey(true)); }catch(e){} resDraw(); return; }
    downloadAll({ list:pick, resume:true }); };
}
function selEnd(){ SEL.on=false; SEL.set.clear(); if(!DLC) preClear(); document.body.classList.remove('sel-mode'); renderGrid(false); selDraw(); }
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-sela]'); if(!b) return; const a=b.dataset.sela;
  if(a==='start'){ if(GP.mode) return; SEL.on=true; SEL.set.clear(); document.body.classList.add('sel-mode'); renderGrid(false); selDraw(); }
  else if(a==='all'){ visible().forEach(i=>{ if(i.url){ SEL.set.add(i.name); preStart(i); } }); renderGrid(false); selDraw(); }
  else if(a==='none'){ SEL.set.clear(); preClear(); renderGrid(false); selDraw(); }
  else if(a==='done') selEnd();
  else if(a==='dl'){ const list=ITEMS.filter(i=>SEL.set.has(i.name)&&i.url); if(!list.length) return; if(list.length===1){ download(list[0]); return; } downloadAll({ list }); }
});
addEventListener('keydown',e=>{ if(e.key==='Escape'&&SEL.on&&!$('lb').classList.contains('on')&&!document.querySelector('.dl-scrim.on')) selEnd(); });

function dlAllBtn(cls){
  return `<button class="btn ${cls}" type="button" data-dlall>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>Download all</button>`; }

/* ===== favourites: kept on this device and, when the client is signed in to their portal, saved on their booking ===== */
const FAV_KEY=(window.FOM_PREVIEW?'fom.pvfav.':'fom.fav.')+(GAL.group?'g.'+GAL.group:GAL.folder);   // preview keeps its hearts apart from the client's
let FAV=new Set(); try{ FAV=new Set(JSON.parse(localStorage.getItem(FAV_KEY)||'[]')); }catch(e){}
let favSave=null;   // set by the Firebase module below when the client is signed in
function favStatus(t,cls){ const e=$('favSt'); if(e){ e.textContent=t||''; e.className='st'+(cls?' '+cls:''); } }
function favChanged(){
  FAV_DIRTY=true;
  try{ localStorage.setItem(FAV_KEY, JSON.stringify([...FAV])); }catch(e){}
  const n=$('favN'); if(n) n.textContent=FAV.size;
  if(favSave) favSave([...FAV]); else if(GAL.order) favStatus('Saved on this device. Open the gallery from your portal to send your picks.','warn');
}
function toggleFav(it,btn){
  if(!it) return; const on=!FAV.has(it.name);
  if(on) FAV.add(it.name); else FAV.delete(it.name);
  if(btn){ btn.classList.toggle('on',on); btn.setAttribute('aria-pressed',on); btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop'); }
  favChanged();
  if(FILTER==='fav' && !on && !$('lb').classList.contains('on')) renderGrid(false);
  else document.querySelectorAll(`.fav[data-fav="${ITEMS.indexOf(it)}"]`).forEach(b=>{ b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });
  if($('lb').classList.contains('on')){ paintLbFav(); const th=$('lbStrip').querySelector(`[data-t="${LBL.indexOf(it)}"]`); if(th){ const h=th.querySelector('.h'); if(on&&!h) th.insertAdjacentHTML('beforeend','<span class="h">&#9829;</span>'); if(!on&&h) h.remove(); } }
}
function paintLbFav(){ const it=LBL[LBI], b=$('lbFav'); if(!it||!b) return; const on=FAV.has(it.name); b.classList.toggle('on',on); b.setAttribute('aria-label',(on?'Remove from':'Add to')+' favourites'); }
function mergeFavs(list){ (list||[]).forEach(n=>FAV.add(n)); try{ localStorage.setItem(FAV_KEY, JSON.stringify([...FAV])); }catch(e){} const n=$('favN'); if(n) n.textContent=FAV.size; if($('grid')) renderGrid(false); }
window.FOM_FAV={ merge:mergeFavs, setSaver:f=>{ favSave=f; }, status:favStatus, list:()=>[...FAV] };

let FAV_DIRTY=false;

/* ===== group photos: when FOM Studios switches it on, the organiser ticks which photos everyone on the group link can see =====
   Separate from hearts. Saved through the gallery Worker the moment they tap Done; the group link updates straight away. */
const GP={ on:false, mode:false, picks:new Set(), saved:'', save:null };
function gpDraw(){
  const b=$('gpBar'); if(!b) return; b.classList.toggle('on',GP.on); if(!GP.on) return;
  const n=GP.picks.size, tot=ITEMS.filter(i=>i.kind==='image'||i.kind==='video').length;
  b.innerHTML=GP.mode
    ?`<div class="tx"><b>&#128101; Tap the photos the group can see</b>${n} of ${tot} approved. Untick anything you would rather keep to yourself.<span class="st" id="gpSt"></span></div><div class="bt"><button class="btn ghost sm" type="button" data-gpa="all">Select all</button><button class="btn ghost sm" type="button" data-gpa="none">Select none</button><button class="btn sm" type="button" data-gpa="done">Done &#10003;</button></div>`
    :`<div class="tx"><b>&#128101; Choose what the group sees</b>${n?`You approved ${n} photo${n===1?'':'s'} for the group link. Everyone on it sees only these.`:'Everyone at the event gets a link to the photos. Tick the ones you are happy for them to see.'}<span class="st ${GP.stCls||''}" id="gpSt">${esc(GP.st||'')}</span></div><div class="bt"><button class="btn sm" type="button" data-gpa="choose">${n?'Change the photos':'Choose photos'}</button></div>`;
  const gn=$('gpN'); if(gn) gn.textContent=n;

function gpToggle(it){

/* ===== downloads that save straight away (no preview tab) =====
   iPhone / iPad: the files are fetched, then one tap opens the share sheet with "Save Image" / "Save to Photos".
   Android: each file downloads straight into the phone (Downloads / Gallery).
   Computer: one file downloads directly; Download all builds a single .zip in the browser.
   Files come from the R2 Worker, which allows cross-site fetches, so nothing new is needed on the server. */
const UA = navigator.userAgent;
const IS_IOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/i.test(UA);
const MIME = { jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', webp:'image/webp', gif:'image/gif', heic:'image/heic', avif:'image/avif', mp4:'video/mp4', mov:'video/quicktime', m4v:'video/mp4', webm:'video/webm' };
const fileUrl = it => it.url + (it.url.includes('?') ? '&' : '?') + 'dl=1';
function canShareFiles(){ try{ return !!(navigator.canShare && navigator.canShare({ files:[ new File(['x'], 'x.jpg', { type:'image/jpeg' }) ] })); }catch(e){ return false; } }
const USE_SHARE = IS_IOS && canShareFiles();
/* ---- head start: a ticked photo starts coming down in the background (3 at a time, up to a memory cap) ---- */
const PRE = new Map();   // name -> { p:Promise<File>, ac, got, total, subs:Set, done }
const PRE_CAP = IS_IOS ? 400e6 : 900e6;
let PREQ = [];
function preBytes(){ let b = 0; PRE.forEach(e => b += e.total || 0); return b; }
function prePump(){
  let busy = 0; PRE.forEach(e => { if(!e.done && e.started) busy++; });
  while(busy < 3 && PREQ.length){
    const it = PREQ.shift(), e = PRE.get(it.name); if(!e || e.started) continue;
    e.started = true; busy++;
    e.p = getFileRaw(it, e.ac.signal, (g, t) => { e.got = g; e.total = t || e.total; e.subs.forEach(f => { try{ f(g, t); }catch(x){} }); selProg(); });
    e.p.then(() => { e.done = true; selProg(); }, () => { PRE.delete(it.name); }).then(prePump);
  }
}
function preStart(it){
  if(!it || !it.url || PRE.has(it.name)) return;
  if(preBytes() + (+it.size || 0) > PRE_CAP) return;   // big selections: the rest comes down when they tap Download
  PRE.set(it.name, { ac:new AbortController(), got:0, total:+it.size || 0, subs:new Set(), done:false, started:false });
  PREQ.push(it); prePump();
}
function preStop(name){ const e = PRE.get(name); if(!e) return; try{ e.ac.abort(); }catch(x){} PRE.delete(name); PREQ = PREQ.filter(i => i.name !== name); prePump(); }
function preClear(){ [...PRE.keys()].forEach(preStop); }
let SELPT = 0;
function selProg(){ if(SELPT) return; SELPT = setTimeout(() => { SELPT = 0; if(SEL.on) selDraw(); }, 400); }

/* ---- speed and time left ---- */
function meter(total){
  const t0 = Date.now(); let last = '';
  return got => {
    const sec = (Date.now() - t0) / 1000; if(sec < 1.5 || got <= 0) return last;
    const bps = got / sec, left = Math.max(0, total - got) / bps;
    const lt = left < 8 ? 'A few seconds left' : left < 90 ? 'About ' + Math.round(left / 5) * 5 + ' seconds left' : 'About ' + Math.round(left / 60) + ' min left';
    return last = lt + ' · ' + (bps / 1e6).toFixed(1) + ' MB/s';
  };
}
const KEEP = 'Keep this page open until it says done. Big photos take a moment on mobile data.';

/* ---- several files at once (4 by default): resolves in list order, onDone(file, item) as each one lands ---- */
async function getMany(items, signal, onProg, onDone, at){
  const out = new Array(items.length), got = new Array(items.length).fill(0); let next = 0, chain = Promise.resolve();
  const report = () => onProg(got.reduce((a, b) => a + b, 0));
  async function worker(){
    while(next < items.length){
      const k = next++, it = items[k];
      out[k] = await getFile(it, signal, g => { got[k] = g; report(); });
      got[k] = +it.size || out[k].size; report();
      if(onDone){ const c = chain.then(() => onDone(out[k], it, k)); chain = c.catch(() => {}); await c; }   // one at a time (the zip writer is not shared-safe)
    }
  }
  await Promise.all(Array.from({ length:Math.min(at || 4, items.length) }, worker));
  return out;
}

async function getFile(it, signal, onProgress){
  const e = PRE.get(it.name);
  if(e && e.started){   // already coming down (or done) from the tick
    if(onProgress){ onProgress(e.got, e.total); e.subs.add(onProgress); }
    try{
      return await new Promise((res, rej) => { e.p.then(res, rej); if(signal){ const no = () => rej(new DOMException('Cancelled', 'AbortError')); if(signal.aborted) no(); else signal.addEventListener('abort', no); } });
    } catch(x){ if(x && x.name === 'AbortError' && signal && signal.aborted) throw x; PRE.delete(it.name); }
    finally { if(onProgress) e.subs.delete(onProgress); }
  } else if(e){ preStop(it.name); }
  return getFileRaw(it, signal, onProgress);
}
async function getFileRaw(it, signal, onProgress){
  const r = await fetch(fileUrl(it), { signal });
  if(!r.ok) throw new Error('Could not get ' + it.name + ' (' + r.status + ')');
  const total = +r.headers.get('content-length') || +it.size || 0;
  if(!r.body || !onProgress){ const b = await r.blob(); return new File([b], it.name, { type: MIME[ext(it.name)] || b.type || 'application/octet-stream' }); }
  const rd = r.body.getReader(), parts = []; let got = 0;
  for(;;){ const { done, value } = await rd.read(); if(done) break; parts.push(value); got += value.length; onProgress(got, total); }
  return new File(parts, it.name, { type: MIME[ext(it.name)] || 'application/octet-stream' });
}
function saveBlob(file, name){
  const u = URL.createObjectURL(file), a = document.createElement('a');
  a.href = u; a.download = name || file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}

/* two choices (e.g. Continue / Start again, Try again / Skip): resolves 'go' or 'alt' */

function guest(){ try{ const g = JSON.parse(localStorage.getItem('fom.guest') || 'null'); return g && g.n ? g : null; }catch(e){ return null; } }
function guestOk(){
  if(!GAL.group || guest()) return Promise.resolve(true);
  return new Promise(res => {
    const el = document.createElement('div'); el.className = 'dl-scrim on';
    el.innerHTML = `<form class="dl-box gq" role="dialog" aria-modal="true" aria-labelledby="gqT"><div class="dl-h" id="gqT">Before you download</div>
      <div class="dl-sub">This helps us know who is enjoying the photos.</div>
      <label>Your name<input name="n" required maxlength="60" autocomplete="name" placeholder="First and last name"></label>
      <label>WhatsApp number <small>(optional)</small><input name="p" type="tel" maxlength="20" autocomplete="tel" placeholder="e.g. 082 123 4567"></label>
      <div class="dl-acts"><button class="btn" type="submit">Continue to download</button><button class="btn ghost" type="button" data-x>Cancel</button></div></form>`;
    document.body.appendChild(el);
    const f = el.querySelector('form'), done = ok => { el.remove(); res(ok); };
    setTimeout(() => f.n.focus(), 50);
    el.querySelector('[data-x]').onclick = () => done(false);
    el.onclick = e => { if(e.target === el) done(false); };
    f.onsubmit = e => { e.preventDefault(); const n = f.n.value.trim(); if(n.length < 2) return f.n.focus();
      let id = ''; try{ id = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/-/g, '').slice(0, 20); }catch(x){ id = String(Date.now()); }
      try{ localStorage.setItem('fom.guest', JSON.stringify({ id, n, p:f.p.value.trim() })); }catch(x){}
      done(true); };
  });
}

async function download(it){
  if(!it || !it.url) return;
  if(!(await guestOk())) return;
  ev('download', it.name);
  const M1 = meter(+it.size || 1);
  if(!USE_SHARE && !IS_ANDROID && !IS_IOS){   // computer: quick direct download
    DLC = new AbortController();
    try{ showDl('Downloading'); setDl(it.name, 3);
      const f = await getFile(it, DLC.signal, (g, t) => { const m = M1(g); setDl(it.name + (t ? ' · ' + Math.round(g / t * 100) + '%' : '') + (m ? ' · ' + m : ''), t ? g / t * 100 : null); });
      saveBlob(f); closeDl(); }
    catch(e){ failDl(e); }
    return;
  }
  DLC = new AbortController();
  try{
    showDl(USE_SHARE ? 'Getting your ' + (it.kind === 'video' ? 'video' : 'photo') : 'Downloading'); setDl(it.name, 3);
    const f = await getFile(it, DLC.signal, (g, t) => { const m = M1(g); setDl(it.name + (t ? ' · ' + Math.round(g / t * 100) + '%' : '') + (m ? ' · ' + m : ''), t ? g / t * 100 : null); });
    if(USE_SHARE){
      $('dlT').textContent = 'Your ' + (it.kind === 'video' ? 'video' : 'photo') + ' is ready'; setDl(it.name, 100);
      $('dlN').textContent = 'Tap below, then choose "' + (it.kind === 'video' ? 'Save Video' : 'Save Image') + '" to put it in your Photos.';
      await waitTap(it.kind === 'video' ? 'Save video' : 'Save photo');
      await shareFiles([f]);
    } else saveBlob(f);
    closeDl();
  }catch(e){ failDl(e); }
}

/* ---- tracking: you get "Download started", then "Download finished" (Workflow ticks Downloaded) or "Download stopped at X of N" ---- */
const DEV = IS_IOS ? 'iPhone' : IS_ANDROID ? 'Android' : 'computer';
let DLJOB = null;   // { n, saved, label, zip, at }
function jobEnd(ok){
  if(!DLJOB) return; const j = DLJOB; DLJOB = null; if(j.sel) return;
  if(ok) return ev('dlok', 'all ' + j.n + ' ' + j.label + ' · ' + DEV);
  ev('dlstop', (j.zip ? 'zip stopped while preparing, at ' + j.at + ' of ' + j.n : 'saved ' + j.saved + ' of ' + j.n) + ' ' + j.label + ' · ' + DEV);
}
addEventListener('pagehide', () => jobEnd(false));   // closed the tab or left mid-way
/* iPhone remembers which files are already saved, per gallery and tab, so a new visit carries on instead of starting over */
const dlKey = sel => 'fom.dl.' + (GAL.group ? 'g.' + GAL.group : GAL.folder) + '.' + ((sel === undefined ? DLSEL : sel) ? 'sel' : FILTER) + (window.FOM_PREVIEW ? '.pv' : '');
let DLSEL = false;   // downloading a hand-picked selection: its own resume memory (key .sel, with the picked names), no finished/stopped events
function dlGet(){ try{ return JSON.parse(localStorage.getItem(dlKey()) || 'null'); }catch(e){ return null; } }
function dlPut(v){ try{ v ? localStorage.setItem(dlKey(), JSON.stringify(v)) : localStorage.removeItem(dlKey()); }catch(e){} }

/* ---- every file (or the current tab: All / Photos / Videos / Favourites) ---- */
let LASTDL = {};
async function downloadAll(opts){
  opts = opts || {};
  if(!(await guestOk())) return;
  LASTDL = opts;
  const list = (opts.list || visible()).filter(i => i.url);
  if(!list.length) return;
  DLSEL = !!opts.list;
  const label = DLSEL ? (list.every(i => i.kind === 'video') ? 'videos' : list.every(i => i.kind === 'image') ? 'photos' : 'files') : FILTER === 'fav' ? 'favourites' : FILTER === 'image' ? 'photos' : FILTER === 'video' ? 'videos' : 'files';
  const what = (DLSEL ? list.length + ' selected ' : 'all ' + list.length + ' ') + label;
  DLC = new AbortController(); const sig = DLC.signal;
  let totalBytes = list.reduce((a, i) => a + (+i.size || 0), 0) || 1;
  let doneBytes = 0;
  const pct = extra => (doneBytes + (extra || 0)) / totalBytes * 100;
  let mt = meter(totalBytes);
  try{
    if(USE_SHARE && !opts.zip){
      /* iPhone: parts of up to 60 files (or about 400 MB), each saved with one tap on the share sheet */
      showDl('Saving ' + list.length + ' ' + label + ' to your Photos');
      const was = dlGet() || {}, pickNow = list.map(i => i.name).sort().join('|');
      const same = !DLSEL || (Array.isArray(was.pick) && was.pick.slice().sort().join('|') === pickNow);   // a different selection starts fresh
      let saved = new Set(same ? (was.names || []).filter(nm => list.some(i => i.name === nm)) : []);
      let todo = list.filter(i => !saved.has(i.name));
      if(saved.size && todo.length && opts.resume){ /* came from "Carry on": no second question */ }
      else if(saved.size && todo.length){
        $('dlT').textContent = 'Welcome back';
        setDl(saved.size + ' of ' + list.length + ' are already saved on this phone', saved.size / list.length * 100);
        $('dlN').textContent = 'Carry on with the ' + todo.length + ' still to save, or start again from the first one.';
        if(await choose('Continue (' + todo.length + ' left)', 'Start again') === 'alt'){ saved = new Set(); todo = list; dlPut(null); }
        $('dlN').textContent = ''; $('dlT').textContent = 'Saving ' + list.length + ' ' + label + ' to your Photos';
      } else if(!todo.length){ saved = new Set(); todo = list; dlPut(null); }   // saved everything before: a fresh round
      ev('download', what + (saved.size ? ' (carrying on from ' + saved.size + ')' : '') + ' · ' + DEV);
      DLJOB = { n:list.length, saved:saved.size, label, sel:DLSEL };
      totalBytes = todo.reduce((a, i) => a + (+i.size || 0), 0) || 1;
      mt = meter(totalBytes);
      const batches = []; let cur = [], sz = 0;
      todo.forEach(i => { if(cur.length && (cur.length >= 60 || sz + (+i.size || 0) > 400e6)){ batches.push(cur); cur = []; sz = 0; } cur.push(i); sz += +i.size || 0; });
      if(cur.length) batches.push(cur);
      let n = saved.size, skipped = 0;
      for(let b = 0; b < batches.length; b++){
        const files = [], many = batches.length > 1, partTxt = 'part ' + (b + 1) + ' of ' + batches.length;
        $('dlT').textContent = many ? 'Getting ' + partTxt : 'Getting your ' + label;
        $('dlN').textContent = KEEP;
        let landed = 0; const base0 = n;
        const fl = await getMany(batches[b], sig, g => setDl('Getting ' + Math.min(list.length, base0 + landed + 1) + ' of ' + list.length + ' · ' + mt(doneBytes + g), pct(g)), () => { landed++; });
        files.push(...fl); n += fl.length;
        doneBytes += batches[b].reduce((a, i) => a + (+i.size || 0), 0);
        for(;;){
          $('dlT').textContent = many ? 'Part ' + (b + 1) + ' of ' + batches.length + ' is ready' : 'Your ' + label + ' are ready';
          setDl(files.length + ' files ready' + (many ? ' (' + (saved.size) + ' of ' + list.length + ' saved so far)' : ''), pct());
          $('dlN').innerHTML = 'Tap below, then choose "Save ' + files.length + ' Items" to put them in your Photos.' + (b === 0 && !saved.size ? ' <br>Prefer one .zip file in Files? <a href="#" data-dlzip>Download a zip instead</a>' : '');
          await waitTap(many ? 'Save ' + partTxt : 'Save ' + files.length + ' to Photos');
          if(await shareFiles(files)){
            batches[b].forEach(i => saved.add(i.name)); DLJOB.saved = saved.size;
            dlPut(Object.assign({ names:[...saved], at:Date.now() }, DLSEL ? { pick:list.map(i => i.name) } : {}));
            break;
          }
          /* share sheet closed without saving: say so instead of quietly moving on */
          $('dlT').textContent = (many ? 'Part ' + (b + 1) : 'Your ' + label) + ' did not save';
          setDl('The share sheet closed before "Save ' + files.length + ' Items" was tapped.', pct());
          $('dlN').textContent = 'Try again to save these ' + files.length + ', or skip them for now.';
          if(await choose('Try again', 'Skip these') === 'alt'){ skipped += files.length; break; }
        }
        $('dlN').textContent = '';
      }
      $('dlX').textContent = 'Close';
      if(saved.size >= list.length){
        dlPut(null); jobEnd(true);
        $('dlT').textContent = 'All done'; setDl('All ' + list.length + ' are in your Photos. Enjoy!', 100);
      } else {
        jobEnd(false);
        $('dlT').textContent = saved.size + ' of ' + list.length + ' saved';
        setDl(skipped + ' were skipped.', saved.size / list.length * 100);
        $('dlN').textContent = DLSEL ? 'Open this gallery on this phone any time: it offers to carry on with the selected ones still missing.' : 'Open this gallery on this phone any time and tap Download all: it carries on with the ones still missing.';
      }
      return;
    }
    ev('download', what + ' · ' + (opts.zip ? DEV + ' (zip)' : DEV));
    if(IS_ANDROID && !opts.zip){
      /* Android: each file saves straight to the phone (Chrome may ask once to allow several downloads) */
      showDl('Downloading ' + list.length + ' ' + label);
      DLJOB = { n:list.length, saved:0, label, sel:DLSEL };
      $('dlN').textContent = KEEP;
      let n = 0;
      await getMany(list, sig, g => setDl('Saving ' + Math.min(list.length, n + 1) + ' of ' + list.length + ' · ' + mt(g), pct(g)), async f => {
        saveBlob(f); n++; DLJOB.saved = n; await new Promise(r => setTimeout(r, 250));
      }, 3);
      jobEnd(true);
      $('dlT').textContent = 'All done'; setDl('Your ' + label + ' are in your Downloads and Gallery.', 100); $('dlX').textContent = 'Close';
      return;
    }
    /* computer (or the zip choice on iPhone): one .zip, split into parts above 2 GB (1 GB on a phone) */
    showDl('Preparing your download');
    DLJOB = { n:list.length, saved:0, at:0, label, zip:true, sel:DLSEL };
    const cap = IS_IOS || IS_ANDROID ? 1e9 : 2e9;
    const base = (String(GAL.name || 'Gallery').trim() + ' ' + ((window.FOM_CLIENT && FOM_CLIENT.name) || 'FOM Studios')).replace(/[^\w\- ]+/g, '').replace(/\s+/g, '-');
    let zip = makeZip(), n = 0;
    const parts = [];
    $('dlN').textContent = KEEP;
    await getMany(list, sig, g => setDl('Getting ' + Math.min(list.length, n + 1) + ' of ' + list.length + ' · ' + mt(g), pct(g)), async f => {
      n++; DLJOB.at = n;
      if(zip.size && zip.size + f.size > cap){ parts.push(zip.finish()); zip = makeZip(); }
      await zip.add(f);
    });
    parts.push(zip.finish());
    parts.forEach((b, k) => saveBlob(b, base + (parts.length > 1 ? '-part' + (k + 1) : '') + '.zip'));
    jobEnd(true);
    $('dlT').textContent = 'Download started'; setDl(list.length + ' ' + label + ' in ' + (parts.length > 1 ? parts.length + ' zip files' : 'one zip file') + '. Check your ' + (IS_IOS ? 'Files app (Downloads)' : 'Downloads folder') + '.', 100); $('dlX').textContent = 'Close';
  }catch(e){ failDl(e); }
}

/* ---- tiny ZIP writer (stored, no compression: photos and videos are already compressed) ---- */
const CRC_T = (() => { const t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(buf){ let c = 0xFFFFFFFF; for(let i = 0; i < buf.length; i++) c = CRC_T[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(){
  const parts = [], central = []; let offset = 0;
  const enc = new TextEncoder(), used = {};
  const dosTime = d => ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = d => (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
  return {
    get size(){ return offset; },
    async add(file){
      let name = file.name, k = 1; while(used[name]){ k++; name = file.name.replace(/(\.[^.]*)?$/, m => '-' + k + m); } used[name] = 1;
      const data = new Uint8Array(await file.arrayBuffer()), crc = crc32(data), nm = enc.encode(name), now = new Date();
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, dosTime(now), true); h.setUint16(12, dosDate(now), true); h.setUint32(14, crc, true);
      h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
      parts.push(h, nm, file);   // the File itself, so the bytes are not held twice
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, dosTime(now), true); c.setUint16(14, dosDate(now), true); c.setUint32(16, crc, true);
      c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nm.length, true);
      c.setUint32(42, offset, true);
      central.push(c, nm);
      offset += 30 + nm.length + data.length;
    },
    finish(){
      const cdSize = central.reduce((a, x) => a + (x.byteLength || x.length), 0), count = central.length / 2;
      const e = new DataView(new ArrayBuffer(22));
      e.setUint32(0, 0x06054b50, true); e.setUint16(8, count, true); e.setUint16(10, count, true);
      e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
      return new Blob([...parts, ...central, e], { type:'application/zip' });
    }
  };
}
document.addEventListener('click', e => { if(e.target.closest('[data-dlall]')){ e.preventDefault(); downloadAll(); } });


/* ===== video stills: show a frame of each video in the grid and the viewer strip, like the photos =====
   Only the start of the file is fetched (the Worker answers Range requests), and only once the card is near the screen. */
const stillHtml=it=>it.url&&playable(it.name)?`<video class="vstill" data-vs="${esc(it.url)}" muted playsinline preload="none" disablepictureinpicture disableremoteplayback tabindex="-1" aria-hidden="true"></video>`:'';
const stillIO=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){stillIO.unobserve(e.target);loadStill(e.target);}}),{rootMargin:'300px'}):null;
function loadStill(v){
  if(v.dataset.on) return; v.dataset.on='1';
  const show=()=>{v.classList.add('ready');const ph=v.parentElement&&v.parentElement.querySelector('.ph');if(ph)ph.style.visibility='hidden';};
  v.addEventListener('loadeddata',show,{once:true});
  v.addEventListener('seeked',show,{once:true});
  v.addEventListener('loadedmetadata',()=>{ if(v.duration&&isFinite(v.duration)&&v.currentTime<0.1){ try{v.currentTime=Math.min(0.5,v.duration/3);}catch(_){} } },{once:true});
  v.addEventListener('error',()=>v.remove(),{once:true});   // keeps the camera icon
  v.addEventListener('loadedmetadata',()=>{ if(!v.videoWidth) v.remove(); },{once:true});
  v.preload='metadata'; v.src=v.dataset.vs+'#t=0.5';
}
function watchStills(root){ root.querySelectorAll('video.vstill:not([data-on])').forEach(v=>stillIO?stillIO.observe(v):loadStill(v)); }

/* ===== viewer: swipe left/right with the photo following your finger, thumbnail strip underneath ===== */
let LBI=0, LBL=[];                       // LBL = the files in the tab you opened from (All / Photos / Videos)
const thumbOf=it=>it.kind==='video'?(it.poster||''):(it.th||it.url);
function openLb(gi){
  LBL=visible(); LBI=Math.max(0,LBL.indexOf(ITEMS[gi]));
  $('lbStrip').innerHTML=LBL.map((it,i)=>{const t=thumbOf(it);
    return `<button class="lb-th" type="button" data-t="${i}" aria-label="Open ${esc(it.name)}">${t?`<img src="${esc(t)}" loading="lazy" decoding="async" alt="">`:(it.kind==='video'?stillHtml(it):'')}${it.kind==='video'?'<span class="v">&#9654;</span>':''}${FAV.has(it.name)?'<span class="h">&#9829;</span>':''}</button>`;}).join('');
  watchStills($('lbStrip')); paintLb(); $('lb').classList.add('on'); document.body.style.overflow='hidden';
}
function closeLb(){$('lb').classList.remove('on');$('lbMedia').innerHTML='';document.body.style.overflow='';}
function stepLb(d,swiped){
  if(LBL.length<2) return;
  const m=$('lbMedia'), w=$('lbStage').clientWidth||innerWidth;
  // slide the current file out, then the next one in from the other side
  m.classList.add('slide'); m.style.transform=`translateX(${d>0?-w:w}px)`; m.style.opacity='0';
  setTimeout(()=>{ LBI=(LBI+d+LBL.length)%LBL.length; paintLb();
    m.classList.remove('slide'); m.style.transform=`translateX(${d>0?w*.35:-w*.35}px)`;
    requestAnimationFrame(()=>{ m.classList.add('slide'); m.style.transform=''; m.style.opacity=''; });
  }, swiped?150:180);
}
function goLb(i){ if(i===LBI) return; const d=i>LBI?1:-1; LBI=i-d; stepLb(d); }
function paintLb(){
  const it=LBL[LBI]; if(!it) return;
  $('lbName').textContent=it.name;$('lbSize').textContent=fmtSize(it.size);$('lbCount').textContent=(LBI+1)+' of '+LBL.length;
  $('lbProg').style.width=((LBI+1)/LBL.length*100)+'%';
  const m=$('lbMedia');
  const noVid=()=>`<div class="novid">${it.poster?`<img src="${esc(it.poster)}" alt="" style="max-height:60vh;border-radius:8px;margin:0 auto 16px">`:''}<p>This video can't play on this device.<br>Use <b>Download</b> to save the full-quality video.</p></div>`;
  if(it.kind==='video'&&it.url&&playable(it.name)){
    // MOV is tried too: iPhone and H.264 MOVs play in most browsers. If this device can't play it, show the download message instead.
    m.innerHTML=`<video src="${esc(it.url)}" controls autoplay playsinline ${it.poster?`poster="${esc(it.poster)}"`:''}></video>`;
    const v=m.querySelector('video'), fail=()=>{ if(m.contains(v)) m.innerHTML=noVid(); };
    v.addEventListener('error',fail,{once:true});
    v.addEventListener('loadedmetadata',()=>{ if(!v.videoWidth) fail(); },{once:true});   // sound but no picture means the video codec is not supported
  }
  else if(it.kind==='video') m.innerHTML=noVid();
  else if(it.kind==='image'&&it.url){
    /* fast previews: the small copy shows at once, the 2048 px copy swaps in when it lands (the original is only for downloads) */
    const hi=it.web||it.url, lo=it.th&&it.th!==hi?it.th:'';
    m.innerHTML=`<img src="${esc(lo||hi)}" alt="${esc(it.name)}" draggable="false"${lo?' class="lb-lo"':''}>`;
    if(lo){ const im=new Image(); im.onload=()=>{ const cur=m.querySelector('img'); if(cur&&cur.getAttribute('src')===lo){ cur.src=hi; cur.classList.remove('lb-lo'); } }; im.src=hi; }
    [1,-1].forEach(d=>{ const nb=LBL&&LBL[(LBI+d+LBL.length)%LBL.length]; if(nb&&nb.kind==='image'&&nb.web){ const p=new Image(); p.src=nb.web; } });   // next and previous ready before the swipe
  }
  else m.innerHTML=`<div class="novid"><p>No preview. Use <b>Download</b> to save this file.</p></div>`;
  $('lbDl').onclick=()=>download(it);
  // order a print or frame of this photo (print-cart.js, FOM only)
  const pb=$('lbPrint'); if(pb){ pb.hidden=!(window.FOM_PRINT&&FOM_PRINT.live()&&it.kind==='image'); pb.onclick=()=>FOM_PRINT.open({src:'gallery',g:GAL.folder,n:it.name,thumb:it.th||it.url,preview:it.web||it.url,title:'Your photo'}); }
  paintLbFav();
  // highlight the thumbnail and keep it centred in the strip
  const st=$('lbStrip'), on=st.querySelector('.lb-th.on'); if(on) on.classList.remove('on');
  const th=st.querySelector(`[data-t="${LBI}"]`); if(th){ th.classList.add('on'); st.scrollTo({left:th.offsetLeft-st.clientWidth/2+th.offsetWidth/2}); }
  // load the next and previous photos early so swiping feels instant
  [1,-1].forEach(d=>{ const n=LBL[(LBI+d+LBL.length)%LBL.length]; if(n&&n.kind==='image'&&n.url){ const im=new Image(); im.src=n.url; } });
}
$('lbStrip').addEventListener('click',e=>{const b=e.target.closest('[data-t]'); if(b) goLb(+b.dataset.t);});
$('lbFav').onclick=()=>toggleFav(LBL[LBI],$('lbFav'));
$('lbClose').onclick=closeLb;$('lbPrev').onclick=()=>stepLb(-1);$('lbNext').onclick=()=>stepLb(1);
$('lbStage').addEventListener('click',e=>{if(e.target.id==='lbStage'||e.target.id==='lbMedia')closeLb();});
/* swipe: the photo follows your finger; let go past a third of the screen (or flick) for the next one; pull down to close */
(function(){ const st=$('lbStage'), m=$('lbMedia'); let x0=0,y0=0,t0=0,on=false,axis='';
  st.addEventListener('touchstart',e=>{ if(e.touches.length!==1||e.target.closest('video,.lb-nav'))return; on=true; axis=''; x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); m.classList.remove('slide'); },{passive:true});
  st.addEventListener('touchmove',e=>{ if(!on)return; const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    if(!axis && (Math.abs(dx)>8||Math.abs(dy)>8)) axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
    if(axis==='x'){ const edge=(LBL.length<2)?.25:1; m.style.transform=`translateX(${dx*edge}px)`; m.style.opacity=String(1-Math.min(.5,Math.abs(dx)/900)); }
    else if(axis==='y'&&dy>0){ m.style.transform=`translateY(${dy}px)`; $('lb').style.background='rgba(18,19,22,'+Math.max(.4,.97-dy/600)+')'; } },{passive:true});
  st.addEventListener('touchend',e=>{ if(!on)return; on=false; const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0, w=st.clientWidth||innerWidth, fast=Date.now()-t0<300;
    $('lb').style.background='';
    if(axis==='x' && LBL.length>1 && (Math.abs(dx)>w/3 || (fast&&Math.abs(dx)>50))) return stepLb(dx<0?1:-1,true);
    if(axis==='y' && dy>110) return closeLb();
    m.classList.add('slide'); m.style.transform=''; m.style.opacity='';
    // double tap the photo to add it to favourites (like Instagram)
    if(!axis && !e.target.closest('video,button')){ const now=Date.now(); if(now-(st._tap||0)<300){ st._tap=0; const it=LBL[LBI]; if(it&&!FAV.has(it.name)) toggleFav(it,$('lbFav'));
        const h=document.createElement('div'); h.className='big-heart'; h.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 2.9 5 6.4 5c2.1 0 3.6 1.2 4.6 2.6C12 6.2 13.5 5 15.6 5 19.1 5 21 8.6 19.6 11.8 17.5 16.4 12 21 12 21z"/></svg>'; st.appendChild(h); setTimeout(()=>h.remove(),750); } else st._tap=now; } });
})();
addEventListener('keydown',e=>{if(!$('lb').classList.contains('on'))return;if(e.key==='Escape')closeLb();else if(e.key==='ArrowRight')stepLb(1);else if(e.key==='ArrowLeft')stepLb(-1);else if(e.key==='f'||e.key==='F')toggleFav(LBL[LBI],$('lbFav'));});

function stateBox(mascot,h,p){$('app').innerHTML=`<div class="state"><div class="box">${mascot?`<img class="mascot" src="${esc(CONFIG.mascot)}" alt="" onerror="this.style.display='none'">`:''}<h3>${h}</h3><p>${p}</p><p style="margin-top:18px">${GAL.group?`<a class="btn ghost" href="https://${esc(CONFIG.site)}">Visit our website</a>`:'<a class="btn ghost" href="client-portal.html">Back to portal</a>'}</p></div></div>`;}
function renderExpired(){if(GAL.group)return groupEnded({title:GAL.title});stateBox(1,'This gallery has expired','To keep your files safe we remove galleries after a set time. Please contact FOM Studios if you still need your deliverables.');}
function renderEmpty(){stateBox(1,'Your gallery is being prepared','Your files aren\'t ready just yet. You\'ll get an email the moment they are.');}
function renderError(){stateBox(1,'Couldn\'t load your gallery','Please check your connection and refresh. If it keeps happening, contact FOM Studios.');}

load();

if(GAL.order){

    const auth = getAuth(app), db = getFirestore(app), ref = doc(db, 'orders', GAL.order);

      // Preview as client: show their real picks, never save (you are signed in as admin and would overwrite them)

          const snap = await getDoc(ref); const had = (snap.exists() && snap.data().favourites) || []; FOM_FAV.merge(had); FOM_FAV.status('Preview: showing their ' + had.length + ' pick' + (had.length === 1 ? '' : 's') + '. Hearts you add here are not saved.', 'warn');

          if(window.FOM_GP){

              let picks = []; try{ const r = await fetch(CONFIG.worker + '/group/picks?order=' + encodeURIComponent(GAL.order), { headers:{ Authorization:'Bearer ' + await user.getIdToken() } }); picks = ((await r.json()) || {}).picks || []; }catch(e){}

          }
        }
        catch(e){ FOM_FAV.status('Preview: hearts are not saved.', 'warn'); }
      });
    }
    else onAuthStateChanged(auth, async user => {
      if(!user){ FOM_FAV.setSaver(null); FOM_FAV.status(FOM_FAV.list().length ? 'Saved on this device. Sign in to your portal to send your picks.' : '', 'warn'); return; }

        if(snap.exists()) FOM_FAV.merge(snap.data().favourites || []);
        // group photos: only when FOM Studios switched it on for this booking (Database, Let them choose the group photos)
        if(snap.exists() && snap.data().groupPicksOn && window.FOM_GP){
          const W = CONFIG.worker, call = async (opt) => { const r = await fetch(W + '/group/picks' + (opt ? '' : '?order=' + encodeURIComponent(GAL.order)), Object.assign({ headers:{ Authorization:'Bearer ' + await user.getIdToken(), 'Content-Type':'application/json' } }, opt || {})); const j = await r.json().catch(() => ({})); if(!r.ok) throw new Error(j.error || 'error ' + r.status); return j; };
          let had = []; try{ had = (await call()).picks || []; }catch(e){}
          FOM_GP.enable(had, list => call({ method:'POST', body:JSON.stringify({ order:GAL.order, picks:list }) }));
        }
        let t = null;
        const save = list => {
          FOM_FAV.status('Saving...');
          clearTimeout(t);
          t = setTimeout(async () => {
            try{ await updateDoc(ref, { favourites: list.slice(0, 1000), favouritesAt: serverTimestamp() }); FOM_FAV.status(list.length ? 'Saved. ' + B + ' can see your ' + list.length + ' pick' + (list.length === 1 ? '' : 's') + '.' : 'Saved.', 'ok'); }

          }, 700);
        };
        FOM_FAV.setSaver(save);
        // picks made before signing in are sent now
        const now = FOM_FAV.list(), had = (snap.exists() && snap.data().favourites) || [];
        if(now.length !== had.length || now.some(n => had.indexOf(n) < 0)) save(now);
        else if(now.length) FOM_FAV.status(B + ' can see your ' + now.length + ' pick' + (now.length === 1 ? '' : 's') + '.', 'ok');
      }catch(e){ console.warn('favourites load', e); FOM_FAV.status('', ''); }
    });
  }catch(e){ console.warn('favourites off', e); }
}
